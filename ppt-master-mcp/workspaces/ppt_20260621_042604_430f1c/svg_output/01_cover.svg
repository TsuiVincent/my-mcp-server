<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="50%" stop-color="#001F4D"/>
      <stop offset="100%" stop-color="#000D1A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#grid)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="180" fill="#FFFFFF" fill-opacity="0.02"/>
  <circle cx="1150" cy="150" r="120" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="-100" cy="600" r="250" fill="#FFFFFF" fill-opacity="0.02"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="720" fill="url(#accentGrad)"/>

  <!-- Top decorative line -->
  <rect x="0" y="0" width="1280" height="4" fill="#00B4D8"/>

  <!-- Title area -->
  <text x="640" y="260" font-family="Microsoft YaHei, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2026年美以对伊军事冲突中</text>
  <text x="640" y="320" font-family="Microsoft YaHei, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle">信息数据战分析报告</text>

  <!-- Decorative divider -->
  <line x1="440" y1="360" x2="840" y2="360" stroke="#00B4D8" stroke-width="2"/>
  <circle cx="640" cy="360" r="4" fill="#00B4D8"/>

  <!-- Subtitle -->
  <text x="640" y="410" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#90CAF9" text-anchor="middle">供内部参阅</text>

  <!-- Info area -->
  <text x="640" y="500" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#B0BEC5" text-anchor="middle">信息数据战研究课题组</text>
  <text x="640" y="540" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#78909C" text-anchor="middle">2026年6月</text>

  <!-- Bottom decoration -->
  <rect x="0" y="690" width="1280" height="4" fill="#0050B3"/>
  <rect x="0" y="694" width="1280" height="26" fill="#003366" fill-opacity="0.5"/>
</svg>