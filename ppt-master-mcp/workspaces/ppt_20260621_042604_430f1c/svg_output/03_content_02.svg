<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F8FC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="topBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGradLight)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#topBarGrad)"/>

  <!-- Title Bar -->
  <rect x="60" y="30" width="50" height="50" fill="#0050B3" rx="4"/>
  <text x="85" y="62" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">02</text>
  <text x="130" y="65" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#1A1A1A">网络阻断已成为开战的"第一枪"</text>
  <line x1="60" y1="95" x2="1220" y2="95" stroke="#0050B3" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Key Message Bar -->
  <rect x="60" y="110" width="1160" height="50" fill="#FFF3E0" rx="6"/>
  <rect x="60" y="110" width="4" height="50" fill="#E65100" rx="2"/>
  <text x="640" y="141" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#1A2E44" text-anchor="middle">先切断对手的数据神经，再实施物理打击——网络战的窗口可能只有数小时，却足以决定战局走向</text>

  <!-- Timeline / Data flow -->
  <!-- Big data highlight box -->
  <rect x="60" y="180" width="360" height="150" fill="#FFFFFF" rx="8" stroke="#E0E6ED" stroke-width="1"/>
  <rect x="60" y="180" width="360" height="4" fill="#C00000"/>
  <text x="240" y="215" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#C00000" text-anchor="middle">98%</text>
  <text x="240" y="245" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#333D4A" text-anchor="middle">伊朗全国互联网流量骤降</text>
  <text x="240" y="270" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B7B8C" text-anchor="middle">前一周正常水平对比 · Cloudflare Radar</text>
  <text x="240" y="295" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B7B8C" text-anchor="middle">最低降至正常水平的约4%</text>

  <rect x="460" y="180" width="360" height="150" fill="#FFFFFF" rx="8" stroke="#E0E6ED" stroke-width="1"/>
  <rect x="460" y="180" width="360" height="4" fill="#C00000"/>
  <text x="640" y="215" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#C00000" text-anchor="middle">7:00 UTC</text>
  <text x="640" y="245" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#333D4A" text-anchor="middle">2026.2.28 开战时刻</text>
  <text x="640" y="270" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B7B8C" text-anchor="middle">IRNA等主要新闻网站遭入侵下线</text>
  <text x="640" y="295" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B7B8C" text-anchor="middle">祈祷应用被劫持推送心理战信息</text>

  <rect x="860" y="180" width="360" height="150" fill="#FFFFFF" rx="8" stroke="#E0E6ED" stroke-width="1"/>
  <rect x="860" y="180" width="360" height="4" fill="#C00000"/>
  <text x="1040" y="215" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#C00000" text-anchor="middle">双重</text>
  <text x="1040" y="245" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#333D4A" text-anchor="middle">伊朗主动切网 + 美以网络攻击</text>
  <text x="1040" y="270" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B7B8C" text-anchor="middle">多重因素叠加导致断网</text>
  <text x="1040" y="295" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B7B8C" text-anchor="middle">德黑兰、法尔斯等省份接近归零</text>

  <!-- Analysis section -->
  <rect x="60" y="355" width="1160" height="200" fill="#FFFFFF" rx="8" stroke="#E0E6ED" stroke-width="1"/>
  <rect x="60" y="355" width="8" height="200" fill="#0050B3" rx="4"/>
  <text x="90" y="390" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#1A2E44">网络战的多维打击体系</text>

  <text x="90" y="425" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#333D4A">
    <tspan x="90" dy="0">❶ <tspan font-weight="bold">物理层断网</tspan>：伊朗当局主动切断全国互联网，阻断外部侦察和内部协调</tspan>
    <tspan x="90" dy="28">❷ <tspan font-weight="bold">网络层攻击</tspan>：美以网络攻击与军事打击同步，入侵IRNA等主要新闻网站</tspan>
    <tspan x="90" dy="28">❸ <tspan font-weight="bold">心理层作战</tspan>：劫持BadeSaba祈祷应用推送心理战信息，瓦解民众意志</tspan>
    <tspan x="90" dy="28">❹ <tspan font-weight="bold">信息层封锁</tspan>：伊朗官方媒体系统瘫痪，信息发布渠道被全面压制</tspan>
  </text>

  <!-- Conclusion -->
  <rect x="60" y="575" width="1160" height="45" fill="#0050B3" fill-opacity="0.08" rx="6"/>
  <text x="640" y="604" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#0050B3" text-anchor="middle">💡 关键信息基础设施的供应链安全和主动防御能力，已与航母、战斗机同等重要</text>

  <!-- Footer -->
  <text x="60" y="700" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#999999">来源：NetBlocks、Cloudflare Radar</text>
  <text x="1220" y="700" font-family="Arial, sans-serif" font-size="14" fill="#999999" text-anchor="end">04</text>
</svg>