  <text x="1085" y="393" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B7B8C" text-anchor="middle">每架MQ-9成本（美元）</text>

  
  <path fill="#0050B3" fill-opacity="0.06" stroke="#0050B3" stroke-opacity="0.2" stroke-width="1" d="M68,420 H1212 A8,8 0 0 1 1220,428 V492 A8,8 0 0 1 1212,500 H68 A8,8 0 0 1 60,492 V428 A8,8 0 0 1 68,420 Z" />
