  <path fill="#FFFFFF" stroke="#E0E6ED" stroke-width="1" d="M958,340 H1212 A8,8 0 0 1 1220,348 V397 A8,8 0 0 1 1212,405 H958 A8,8 0 0 1 950,397 V348 A8,8 0 0 1 958,340 Z" />
