  <text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="15" x="690" y="208"><tspan><tspan font-weight="bold">2026.3.1-2</tspan> 伊朗无人机袭击海湾地区基础设施：</tspan>
    </text><text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="15" x="690" y="234">● AWS阿联酋ME-CENTRAL-1可用区被直接命中</text><text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="15" x="690" y="260">● AWS巴林ME-SOUTH-1可用区遭受间接损害</text><text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="15" x="690" y="286">● EC2、S3、DynamoDB等核心服务严重降级</text><text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="15" x="690" y="312">● 这些数据中心托管着美军AI指挥链核心节点</text><path fill="#FFFFFF" stroke="#E0E6ED" stroke-width="1" d="M668,340 H922 A8,8 0 0 1 930,348 V397 A8,8 0 0 1 922,405 H668 A8,8 0 0 1 660,397 V348 A8,8 0 0 1 668,340 Z" />
