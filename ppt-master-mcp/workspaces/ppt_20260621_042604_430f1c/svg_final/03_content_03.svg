  <text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="14" x="60" y="300">● JASSM/战斧导弹 = 惯性导航 + 卫星接收 + 地形匹配 + 末端目标识别</text><text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="14" x="60" y="324">● 防空弱化后改用JDAM（GBU-31约10.7万）——数据链需求降低致成本骤降</text><text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="14" x="60" y="348">● THAAD库存消耗至少50%，Patriot拦截弹消耗42%-50%</text><path fill="#FFF3E0" d="M666,110 H1214 A6,6 0 0 1 1220,116 V154 A6,6 0 0 1 1214,160 H666 A6,6 0 0 1 660,154 V116 A6,6 0 0 1 666,110 Z" />
  <path fill="#E65100" d="M662,110 H662 A2,2 0 0 1 664,112 V158 A2,2 0 0 1 662,160 H662 A2,2 0 0 1 660,158 V112 A2,2 0 0 1 662,110 Z" />
  <text x="680" y="141" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#1A2E44">算力节点：伊朗非对称反击——不打航母，专打数据中心</text>

