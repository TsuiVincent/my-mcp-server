  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGradLight)" />
  <rect x="0" y="0" width="1280" height="6" fill="url(#topBarGrad)" />

  
  <path fill="#0050B3" d="M64,30 H106 A4,4 0 0 1 110,34 V76 A4,4 0 0 1 106,80 H64 A4,4 0 0 1 60,76 V34 A4,4 0 0 1 64,30 Z" />
  <text x="85" y="62" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">01</text>
  <text x="130" y="65" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#1A1A1A">民用监控系统已成为战略情报源</text>
  <line x1="60" y1="95" x2="1220" y2="95" stroke="#0050B3" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 4" />

  
  <path fill="#E3F2FD" d="M66,110 H1214 A6,6 0 0 1 1220,116 V154 A6,6 0 0 1 1214,160 H66 A6,6 0 0 1 60,154 V116 A6,6 0 0 1 66,110 Z" />
  <path fill="#0050B3" d="M62,110 H62 A2,2 0 0 1 64,112 V158 A2,2 0 0 1 62,160 H62 A2,2 0 0 1 60,158 V112 A2,2 0 0 1 62,110 Z" />
  <text x="640" y="141" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#1A2E44" text-anchor="middle">城市智慧化程度越高，战场透明化程度也越高——民用监控设施的战时军事价值急剧上升</text>

  
  
  <path fill="#FFFFFF" stroke="#E0E6ED" stroke-width="1" d="M68,180 H612 A8,8 0 0 1 620,188 V372 A8,8 0 0 1 612,380 H68 A8,8 0 0 1 60,372 V188 A8,8 0 0 1 68,180 Z" />
  <path fill="#0050B3" d="M64,180 H64 A4,4 0 0 1 68,184 V376 A4,4 0 0 1 64,380 H64 A4,4 0 0 1 60,376 V184 A4,4 0 0 1 64,180 Z" />
  <path fill="#00B4D8" d="M84,195 H176 A4,4 0 0 1 180,199 V217 A4,4 0 0 1 176,221 H84 A4,4 0 0 1 80,217 V199 A4,4 0 0 1 84,195 Z" />
  <text x="130" y="214" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">核心案例</text>
  <text x="200" y="214" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#1A2E44">以色列精确打击德黑兰</text>
  <text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="15" x="80" y="250">● 2026.2.28开战当天，以色列空军对德黑兰市内</text><text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="15" x="88" y="276">多个目标实施精确打击</text><text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="15" x="80" y="302">● 打击坐标来源：8200部队与摩萨德多年渗透</text><text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="15" x="80" y="328">● 长期系统性地接管交通摄像头等民用设备</text><text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="15" x="80" y="354">● AI算法分析行为模式，识别军官护卫车队路线</text><path fill="#FFFFFF" stroke="#E0E6ED" stroke-width="1" d="M668,180 H1212 A8,8 0 0 1 1220,188 V372 A8,8 0 0 1 1212,380 H668 A8,8 0 0 1 660,372 V188 A8,8 0 0 1 668,180 Z" />
  <path fill="#00B4D8" d="M664,180 H664 A4,4 0 0 1 668,184 V376 A4,4 0 0 1 664,380 H664 A4,4 0 0 1 660,376 V184 A4,4 0 0 1 664,180 Z" />
  <path fill="#0050B3" d="M684,195 H776 A4,4 0 0 1 780,199 V217 A4,4 0 0 1 776,221 H684 A4,4 0 0 1 680,217 V199 A4,4 0 0 1 684,195 Z" />
  <text x="730" y="214" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">渗透手段</text>
  <text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="15" x="680" y="255">● 交通监控摄像头——实时视频流加密回传</text><text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="15" x="680" y="281">● 市政传感器——环境数据辅助情报分析</text><text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="15" x="680" y="307">● 车牌识别——推断机构内部车辆隶属关系</text><text font-family="Microsoft YaHei, sans-serif" fill="#333D4A" font-size="15" x="680" y="333">● 出入频率统计——定位秘密指挥点</text><path fill="#FFFFFF" stroke="#0050B3" stroke-opacity="0.3" stroke-width="1" d="M68,400 H1212 A8,8 0 0 1 1220,408 V512 A8,8 0 0 1 1212,520 H68 A8,8 0 0 1 60,512 V408 A8,8 0 0 1 68,400 Z" />
  <rect x="60" y="400" width="1160" height="4" fill="#0050B3" />
  <text x="640" y="440" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#C00000" text-anchor="middle">⚡ 核心结论</text>
  <text x="640" y="475" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#333D4A" text-anchor="middle">民用监控设施已成为"城市安全 ↔ 战场透明"的一线之隔。防御方必须对监控设备</text>
  <text x="640" y="500" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#333D4A" text-anchor="middle">实施严格的密码管理、固件更新和网络隔离。</text>

  
  <text x="60" y="700" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#999999">来源：金融时报、路透社2026年3月深度报道</text>
  <text x="1220" y="700" font-family="Arial, sans-serif" font-size="14" fill="#999999" text-anchor="end">03</text>
</svg>