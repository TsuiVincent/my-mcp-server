<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF" />
  <rect x="0" y="0" width="1280" height="6" fill="url(#topBar)" />
  <rect x="60" y="30" width="50" height="50" fill="#003366" />
  <text x="85" y="62" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="bold">06</text>
  <text x="130" y="62" fill="#1A1A1A" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="bold">总结与启示——三条总体判断</text>
  <rect x="60" y="100" width="1160" height="50" fill="#F2F2F2" />
  <rect x="60" y="100" width="6" height="50" fill="#8B0000" />
  <text x="80" y="131" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="16">综合以上五个维度，归纳三条关于现代信息数据战的核心判断</text>
  
  <path fill="#FFF5F5" stroke="#E0E0E0" stroke-width="1" d="M68,180 H1212 A8,8 0 0 1 1220,188 V312 A8,8 0 0 1 1212,320 H68 A8,8 0 0 1 60,312 V188 A8,8 0 0 1 68,180 Z" />
  <rect x="60" y="180" width="8" height="140" fill="#8B0000" />
  <path fill="#8B0000" d="M84,190 H116 A4,4 0 0 1 120,194 V226 A4,4 0 0 1 116,230 H84 A4,4 0 0 1 80,226 V194 A4,4 0 0 1 84,190 Z" />
  <text x="100" y="216" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="bold">1</text>
  <text x="140" y="216" fill="#8B0000" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="bold">从火力密度转向数据定力</text>
  <text x="140" y="248" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">现代战争的核心已从火力密度转向数据定力。谁掌握数据采集、传输、算力和算法，谁就掌握主动权。</text>
  <text x="140" y="272" fill="#666666" font-family="Microsoft YaHei, sans-serif" font-size="13">案例：以色列8200部队多年渗透伊朗民用监控网→AI输出高精度打击坐标</text>
  <text x="140" y="296" fill="#666666" font-family="Microsoft YaHei, sans-serif" font-size="13">案例：导弹成本差异的核心在于数据链和制导模块的复杂程度</text>
  
  <path fill="#F0F4FF" stroke="#E0E0E0" stroke-width="1" d="M68,340 H1212 A8,8 0 0 1 1220,348 V472 A8,8 0 0 1 1212,480 H68 A8,8 0 0 1 60,472 V348 A8,8 0 0 1 68,340 Z" />
  <rect x="60" y="340" width="8" height="140" fill="#003366" />
  <path fill="#003366" d="M84,350 H116 A4,4 0 0 1 120,354 V386 A4,4 0 0 1 116,390 H84 A4,4 0 0 1 80,386 V354 A4,4 0 0 1 84,350 Z" />
  <text x="100" y="376" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="bold">2</text>
  <text x="140" y="376" fill="#003366" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="bold">民用基础设施即战场延伸</text>
  <text x="140" y="408" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">交通摄像头、云数据中心、低轨卫星互联网、手机APP——这些日常数字服务在战时瞬间转化为情报来源、打击目标和攻防工具。</text>
  <text x="140" y="432" fill="#666666" font-family="Microsoft YaHei, sans-serif" font-size="13">案例：伊朗断网（NetBlocks数据）+ AWS数据中心遭无人机袭</text>
  <text x="140" y="456" fill="#666666" font-family="Microsoft YaHei, sans-serif" font-size="13">案例：Starlink被部署亦被反制——信号无法隐藏</text>
  
  <path fill="#FFF8F0" stroke="#C9A227" stroke-width="1" d="M68,500 H1212 A8,8 0 0 1 1220,508 V622 A8,8 0 0 1 1212,630 H68 A8,8 0 0 1 60,622 V508 A8,8 0 0 1 68,500 Z" />
  <rect x="60" y="500" width="8" height="130" fill="#C9A227" />
  <path fill="#C9A227" d="M84,510 H116 A4,4 0 0 1 120,514 V546 A4,4 0 0 1 116,550 H84 A4,4 0 0 1 80,546 V514 A4,4 0 0 1 84,510 Z" />
  <text x="100" y="536" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="bold">3</text>
  <text x="140" y="536" fill="#C9A227" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="bold">数据战没有单方面的绝对优势</text>
  <text x="140" y="568" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">伊朗以非对称手段打击数据中心、击落无人机、没收星链终端——即使是技术弱势一方，也能找到强者的数据节点实施致命打击。</text>
  <text x="140" y="592" fill="#666666" font-family="Microsoft YaHei, sans-serif" font-size="13">下一次战争的第一声警报，可能不是防空雷达的蜂鸣，而是数据中心的断电报警。</text>
  <rect x="0" y="716" width="1280" height="4" fill="#8B0000" />
  <text x="1220" y="700" text-anchor="end" fill="#999999" font-family="Arial, sans-serif" font-size="12">13</text>
</svg>