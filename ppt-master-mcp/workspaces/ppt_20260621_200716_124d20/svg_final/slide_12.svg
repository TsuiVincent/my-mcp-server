<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF" />
  <rect x="0" y="0" width="1280" height="6" fill="url(#topBar)" />
  <rect x="60" y="30" width="50" height="50" fill="#8B0000" />
  <text x="85" y="62" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="bold">05</text>
  <text x="130" y="62" fill="#1A1A1A" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="bold">星链并非"铁桶"——伊朗的反制手段</text>
  <rect x="60" y="100" width="1160" height="50" fill="#F2F2F2" />
  <rect x="60" y="100" width="6" height="50" fill="#8B0000" />
  <text x="80" y="131" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="16">美军试图利用星链低轨卫星网络向伊朗境内渗透数据节点，但伊朗采取了系统性反制措施</text>
  
  
  <path fill="#F9F9F9" stroke="#E0E0E0" stroke-width="1" d="M68,180 H412 A8,8 0 0 1 420,188 V352 A8,8 0 0 1 412,360 H68 A8,8 0 0 1 60,352 V188 A8,8 0 0 1 68,180 Z" />
  <path fill="#8B0000" d="M68,180 H412 A8,8 0 0 1 420,188 V212 A8,8 0 0 1 412,220 H68 A8,8 0 0 1 60,212 V188 A8,8 0 0 1 68,180 Z" />
  <text x="240" y="206" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">🛰️ Starshield部署</text>
  <text x="80" y="248" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">• SpaceX向美军出售Starshield军事版终端</text>
  <text x="80" y="272" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">• 冲突开始时已部署于十多个无人机系统</text>
  <text x="80" y="296" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">• 旨在实现低延迟、高带宽的战场通信</text>
  <text x="80" y="320" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">• 构建空间信息走廊</text>
  
  <path fill="#FFF8F0" stroke="#E0E0E0" stroke-width="1" d="M468,180 H812 A8,8 0 0 1 820,188 V352 A8,8 0 0 1 812,360 H468 A8,8 0 0 1 460,352 V188 A8,8 0 0 1 468,180 Z" />
  <path fill="#C9A227" d="M468,180 H812 A8,8 0 0 1 820,188 V212 A8,8 0 0 1 812,220 H468 A8,8 0 0 1 460,212 V188 A8,8 0 0 1 468,180 Z" />
  <text x="640" y="206" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">🔍 伊朗反间谍行动</text>
  <text x="480" y="248" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">• 3月起全国性搜缴Starlink终端</text>
  <text x="480" y="272" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">• 3月19日：锡斯坦省捕13人，没收5台</text>
  <text x="480" y="296" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">• 3月25日：德黑兰捕39人，没收7台</text>
  <text x="480" y="320" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">• 非法使用Starlink定为刑事犯罪</text>
  
  <path fill="#F0F4FF" stroke="#E0E0E0" stroke-width="1" d="M868,180 H1212 A8,8 0 0 1 1220,188 V352 A8,8 0 0 1 1212,360 H868 A8,8 0 0 1 860,352 V188 A8,8 0 0 1 868,180 Z" />
  <path fill="#003366" d="M868,180 H1212 A8,8 0 0 1 1220,188 V212 A8,8 0 0 1 1212,220 H868 A8,8 0 0 1 860,212 V188 A8,8 0 0 1 868,180 Z" />
  <text x="1040" y="206" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">📡 射频干扰系统</text>
  <text x="880" y="248" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">• 部署先进的军事级射频干扰系统</text>
  <text x="880" y="272" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">• 对Starlink信号实施高强度干扰</text>
  <text x="880" y="296" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">• 导致部分地区终端完全失效</text>
  <text x="880" y="320" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">• 利用信号特征反向定位</text>
  
  <path fill="#FFF5F5" stroke="#C9A227" stroke-width="1" d="M68,390 H1212 A8,8 0 0 1 1220,398 V462 A8,8 0 0 1 1212,470 H68 A8,8 0 0 1 60,462 V398 A8,8 0 0 1 68,390 Z" />
  <rect x="60" y="390" width="6" height="80" fill="#C9A227" />
  <text x="85" y="420" fill="#8B0000" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">💡 核心洞察</text>
  <text x="85" y="445" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">在数据对抗时代，进攻方可以利用卫星网络追踪目标，防御方同样可以利用信号特征反向定位并没收设备。</text>
  <text x="85" y="465" fill="#8B0000" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold">数据内容可以加密，但"正在通信"这一事实无法隐藏。</text>
  <rect x="0" y="716" width="1280" height="4" fill="#8B0000" />
  <text x="60" y="700" fill="#999999" font-family="Microsoft YaHei, sans-serif" font-size="12">来源：公开新闻报道</text>
  <text x="1220" y="700" text-anchor="end" fill="#999999" font-family="Arial, sans-serif" font-size="12">12</text>
</svg>