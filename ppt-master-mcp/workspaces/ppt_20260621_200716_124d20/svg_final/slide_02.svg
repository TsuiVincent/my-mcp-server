<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- 顶部红蓝渐变条 -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#topBar)"/>
  <!-- 左下红色竖条装饰 -->
  <rect x="60" y="80" width="6" height="200" fill="#8B0000"/>
  <!-- 标题 -->
  <text x="80" y="130" fill="#1A1A1A" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="bold">目 录</text>
  <text x="80" y="158" fill="#8B0000" font-family="Microsoft YaHei, sans-serif" font-size="14">CONTENTS</text>
  <rect x="80" y="168" width="60" height="2" fill="#8B0000"/>
  <!-- 目录项 - 左列 -->
  <!-- 第1章 -->
  <rect x="80" y="200" width="50" height="50" fill="#8B0000"/>
  <text x="105" y="232" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="bold">01</text>
  <text x="150" y="228" fill="#1A1A1A" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold">民用监控系统已成为战略情报源</text>
  <text x="150" y="248" fill="#666666" font-family="Microsoft YaHei, sans-serif" font-size="14">以色列8200部队渗透伊朗民用监控网</text>
  <!-- 第2章 -->
  <rect x="80" y="280" width="50" height="50" fill="#8B0000"/>
  <text x="105" y="312" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="bold">02</text>
  <text x="150" y="308" fill="#1A1A1A" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold">网络阻断已成为开战的"第一枪"</text>
  <text x="150" y="328" fill="#666666" font-family="Microsoft YaHei, sans-serif" font-size="14">伊朗互联网流量断崖下跌至正常水平的4%</text>
  <!-- 第3章 -->
  <rect x="80" y="360" width="50" height="50" fill="#8B0000"/>
  <text x="105" y="392" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="bold">03</text>
  <text x="150" y="388" fill="#1A1A1A" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold">战争账单本质上就是数据账单</text>
  <text x="150" y="408" fill="#666666" font-family="Microsoft YaHei, sans-serif" font-size="14">前两个月耗资250-290亿美元</text>
  <!-- 第4章 -->
  <rect x="80" y="440" width="50" height="50" fill="#8B0000"/>
  <text x="105" y="472" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="bold">04</text>
  <text x="150" y="468" fill="#1A1A1A" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold">算力节点已成为高价值战略目标</text>
  <text x="150" y="488" fill="#666666" font-family="Microsoft YaHei, sans-serif" font-size="14">不打航母，专打数据中心</text>
  <!-- 第5章 -->
  <rect x="80" y="520" width="50" height="50" fill="#8B0000"/>
  <text x="105" y="552" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="bold">05</text>
  <text x="150" y="548" fill="#1A1A1A" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold">没有绝对安全的通信手段</text>
  <text x="150" y="568" fill="#666666" font-family="Microsoft YaHei, sans-serif" font-size="14">星链亦非"铁桶"</text>
  <!-- 总结 -->
  <rect x="80" y="600" width="50" height="50" fill="#003366"/>
  <text x="105" y="632" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="bold">06</text>
  <text x="150" y="628" fill="#1A1A1A" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold">总结与启示</text>
  <text x="150" y="648" fill="#666666" font-family="Microsoft YaHei, sans-serif" font-size="14">三条总体判断</text>
  <!-- 底部装饰线 -->
  <rect x="0" y="716" width="1280" height="4" fill="#8B0000"/>
</svg>