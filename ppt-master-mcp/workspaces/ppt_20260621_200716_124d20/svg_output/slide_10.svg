<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#topBar)"/>
  <rect x="60" y="30" width="50" height="50" fill="#8B0000"/>
  <text x="85" y="62" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="bold">04</text>
  <text x="130" y="62" fill="#1A1A1A" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="bold">伊朗非对称打击：数据中心+无人机</text>
  <rect x="60" y="100" width="1160" height="50" fill="#F2F2F2"/>
  <rect x="60" y="100" width="6" height="50" fill="#8B0000"/>
  <text x="80" y="131" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="16">在现代战争中，数据中心与弹药库、指挥所同等重要——算力即战斗力</text>
  <!-- 左侧卡片：数据中心打击 -->
  <rect x="60" y="180" width="560" height="220" rx="8" fill="#F9F9F9" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="180" width="560" height="40" rx="8" fill="#8B0000"/>
  <rect x="60" y="212" width="560" height="8" fill="#8B0000"/>
  <text x="340" y="206" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">🎯 数据中心遭袭</text>
  <text x="80" y="245" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• 2026年3月1-2日，伊朗无人机袭击海湾基础设施</text>
  <text x="80" y="270" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• AWS阿联酋ME-CENTRAL-1和巴林ME-SOUTH-1被直接命中</text>
  <text x="80" y="295" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• 建筑结构损坏、电力中断、消防系统误启动损毁服务器</text>
  <text x="80" y="320" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• EC2、S3、DynamoDB等核心服务严重降级</text>
  <text x="80" y="345" fill="#8B0000" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold">→ 这些数据中心托管着美军AI指挥链核心节点</text>
  <text x="80" y="365" fill="#8B0000" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="bold">→ 无人机侦察画面处理、目标识别算法、情报分析均依赖此算力集群</text>
  <!-- 右侧卡片：无人机打击 -->
  <rect x="660" y="180" width="560" height="220" rx="8" fill="#F9F9F9" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="660" y="180" width="560" height="40" rx="8" fill="#003366"/>
  <text x="940" y="206" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">✈️ MQ-9"死神"无人机被击落</text>
  <text x="680" y="245" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• 伊朗使用AD-08 Majid等防空系统</text>
  <text x="680" y="270" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• 累计击落至少11架MQ-9"死神"无人机</text>
  <text x="680" y="295" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• 每架MQ-9成本约3000-3500万美元</text>
  <text x="680" y="320" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• 损失涉及硬件+后端算力协同链条断裂</text>
  <rect x="680" y="345" width="200" height="40" rx="6" fill="#FFF5F5" stroke="#C9A227" stroke-width="1"/>
  <text x="780" y="370" text-anchor="middle" fill="#8B0000" font-family="Arial, sans-serif" font-size="18" font-weight="bold">≥11架</text>
  <text x="930" y="370" fill="#666666" font-family="Microsoft YaHei, sans-serif" font-size="13">累计损失</text>
  <!-- 结论 -->
  <rect x="60" y="430" width="1160" height="80" rx="8" fill="#FFF8F0" stroke="#C9A227" stroke-width="1"/>
  <rect x="60" y="430" width="6" height="80" fill="#C9A227"/>
  <text x="85" y="460" fill="#8B0000" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">🔑 关键启示</text>
  <text x="85" y="485" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">面对全世界最强大的军队，伊朗选择了一条非对称反击路线——不打航母，专打数据中心。</text>
  <text x="85" y="505" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">即使是技术弱势一方，也能找到强者的数据节点实施致命打击。</text>
  <rect x="0" y="716" width="1280" height="4" fill="#8B0000"/>
  <text x="60" y="700" fill="#999999" font-family="Microsoft YaHei, sans-serif" font-size="12">来源：AWS官方公告 / 公开军事报告</text>
  <text x="1220" y="700" text-anchor="end" fill="#999999" font-family="Arial, sans-serif" font-size="12">10</text>
</svg>