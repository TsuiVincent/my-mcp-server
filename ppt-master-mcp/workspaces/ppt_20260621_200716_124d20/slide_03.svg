<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="chBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
  </defs>
  <!-- 深蓝渐变背景 -->
  <rect width="1280" height="720" fill="url(#chBg)"/>
  <!-- 几何装饰 -->
  <rect x="0" y="0" width="6" height="720" fill="#8B0000" fill-opacity="0.8"/>
  <circle cx="1100" cy="200" r="150" fill="#004080" fill-opacity="0.12"/>
  <circle cx="1150" cy="400" r="100" fill="#0050A0" fill-opacity="0.08"/>
  <!-- 大号章节号（半透明） -->
  <text x="640" y="280" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.08" font-family="Arial, sans-serif" font-size="200" font-weight="bold">01</text>
  <!-- 金色装饰线 -->
  <rect x="490" y="300" width="300" height="2" fill="#C9A227"/>
  <!-- 章节标题 -->
  <text x="640" y="370" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="44" font-weight="bold">民用监控系统已成为战略情报源</text>
  <!-- 副标题 -->
  <text x="640" y="410" text-anchor="middle" fill="#A0B4C8" font-family="Microsoft YaHei, sans-serif" font-size="18">Civilian Surveillance Systems as Strategic Intelligence Sources</text>
  <!-- 红色装饰横线 -->
  <rect x="540" y="435" width="200" height="3" fill="#8B0000"/>
  <!-- 底部信息 -->
  <text x="640" y="500" text-anchor="middle" fill="#8099B0" font-family="Microsoft YaHei, sans-serif" font-size="14">交通摄像头 → 全天候瞄准镜</text>
  <!-- 底部装饰 -->
  <rect x="0" y="716" width="1280" height="4" fill="#8B0000"/>
</svg>