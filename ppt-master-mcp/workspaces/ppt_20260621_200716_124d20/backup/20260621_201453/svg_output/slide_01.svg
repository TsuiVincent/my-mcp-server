<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="50%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#002B5C"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <!-- 金色顶部装饰线 -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#goldLine)"/>
  <!-- 金色底部装饰线 -->
  <rect x="0" y="716" width="1280" height="4" fill="url(#goldLine)"/>
  <!-- 左侧装饰竖条 -->
  <rect x="60" y="0" width="6" height="720" fill="#8B0000" fill-opacity="0.6"/>
  <!-- 几何装饰圆 -->
  <circle cx="1100" cy="150" r="120" fill="#004080" fill-opacity="0.15"/>
  <circle cx="1150" cy="200" r="80" fill="#0050A0" fill-opacity="0.1"/>
  <circle cx="1050" cy="500" r="200" fill="#004080" fill-opacity="0.08"/>
  <!-- 标题区域（居中） -->
  <text x="640" y="260" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="48" font-weight="bold">2026年美以对伊军事冲突中</text>
  <text x="640" y="320" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="48" font-weight="bold">信息数据战的分析报告</text>
  <!-- 装饰分隔线 -->
  <rect x="440" y="355" width="400" height="2" fill="#C9A227"/>
  <!-- 副标题 -->
  <text x="640" y="400" text-anchor="middle" fill="#D4A84B" font-family="Microsoft YaHei, sans-serif" font-size="22">Information &amp; Data Warfare Analysis Report</text>
  <text x="640" y="430" text-anchor="middle" fill="#A0B4C8" font-family="Microsoft YaHei, sans-serif" font-size="16">2026 U.S.-Israel Military Operations Against Iran</text>
  <!-- 内部参阅标识 -->
  <rect x="520" y="460" width="240" height="30" rx="4" fill="#8B0000" fill-opacity="0.8"/>
  <text x="640" y="481" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold">【 供内部参阅 】</text>
  <!-- 底部信息 -->
  <text x="640" y="550" text-anchor="middle" fill="#8099B0" font-family="Microsoft YaHei, sans-serif" font-size="16">2026年6月</text>
  <!-- 底部红色装饰条 -->
  <rect x="0" y="680" width="1280" height="40" fill="#8B0000" fill-opacity="0.3"/>
</svg>