<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
  </defs>
  <!-- 白底 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- 红蓝渐变顶部条 -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#topBar)"/>
  <!-- 标题栏 -->
  <rect x="60" y="30" width="50" height="50" fill="#8B0000"/>
  <text x="85" y="62" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="bold">01</text>
  <text x="130" y="62" fill="#1A1A1A" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="bold">以色列8200部队渗透伊朗民用监控网</text>
  <!-- 关键信息条 -->
  <rect x="60" y="100" width="1160" height="50" fill="#F2F2F2"/>
  <rect x="60" y="100" width="6" height="50" fill="#8B0000"/>
  <text x="80" y="131" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="16">城市里的交通摄像头在战时可以变成对手的全天候瞄准镜——民用监控设施的战时军事价值急剧上升</text>
  <!-- 左侧数据卡片 -->
  <rect x="60" y="180" width="360" height="200" rx="8" fill="#FFF5F5" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="60" y="180" width="360" height="40" rx="8" fill="#8B0000"/>
  <rect x="60" y="212" width="360" height="8" fill="#8B0000"/>
  <text x="240" y="206" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">⚡ 关键行动</text>
  <text x="80" y="245" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• 8200部队与摩萨德联合行动</text>
  <text x="80" y="270" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• 多年系统性地接管监控设备控制权</text>
  <text x="80" y="295" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• 实时视频流加密回传至以色列服务器</text>
  <text x="80" y="320" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• AI算法对海量视频数据进行行为分析</text>
  <text x="80" y="345" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• 直接输出高精度打击坐标</text>
  <!-- 右侧数据卡片 -->
  <rect x="460" y="180" width="360" height="200" rx="8" fill="#F0F4FF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="460" y="180" width="360" height="40" rx="8" fill="#003366"/>
  <text x="640" y="206" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">📡 AI分析内容</text>
  <text x="480" y="245" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• 识别军官护卫车队的典型路线</text>
  <text x="480" y="270" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• 统计特定位置人员/车辆出入频率</text>
  <text x="480" y="295" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• 通过车牌和轨迹推断隶属关系</text>
  <text x="480" y="320" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="15">• 行为模式分析预测目标活动规律</text>
  <!-- 底部结论卡片 -->
  <rect x="60" y="410" width="1160" height="100" rx="8" fill="#FFF8F0" stroke="#C9A227" stroke-width="1"/>
  <rect x="60" y="410" width="6" height="100" fill="#C9A227"/>
  <text x="85" y="440" fill="#8B0000" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold">📌 时间线</text>
  <text x="85" y="470" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">2026年2月28日 开战当天 | 以军F-15战机约7:30起飞 → 9:40"蓝麻雀"导弹命中目标</text>
  <text x="85" y="495" fill="#333333" font-family="Microsoft YaHei, sans-serif" font-size="14">整个过程没有依赖当日临时情报，预先采集并分析的数据流完成了主要情报工作</text>
  <!-- 底部结论 -->
  <rect x="60" y="540" width="1160" height="50" rx="8" fill="#F2F2F2"/>
  <text x="640" y="571" text-anchor="middle" fill="#8B0000" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">结论：城市智慧化程度越高，战场透明化程度也越高</text>
  <!-- 底部 -->
  <rect x="0" y="716" width="1280" height="4" fill="#8B0000"/>
  <text x="60" y="700" fill="#999999" font-family="Microsoft YaHei, sans-serif" font-size="12">来源：金融时报 / 路透社</text>
  <text x="1220" y="700" text-anchor="end" fill="#999999" font-family="Arial, sans-serif" font-size="12">04</text>
</svg>