<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00418D"/>
      <stop offset="100%" stop-color="#072C61"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#topBar)"/>
  <rect x="80" y="100" width="4" height="36" fill="#0066CC"/>
  <text x="100" y="130" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#00418D">星链攻防战：卫星互联网的战场化</text>
  <text x="100" y="155" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#6B7280">CASE STUDY: STARLINK IN THE BATTLEFIELD</text>
  <line x1="80" y1="170" x2="1200" y2="170" stroke="#E2E8F0" stroke-width="1"/>
  
  <rect x="80" y="190" width="1120" height="44" fill="#F0F4F8" rx="4"/>
  <rect x="80" y="190" width="4" height="44" fill="#C41E3A"/>
  <text x="100" y="218" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#1A202C">核心洞察：数据内容可以加密，但"正在通信"这一事实无法隐藏</text>
  
  <!-- Attack side -->
  <rect x="80" y="260" width="540" height="200" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="6"/>
  <rect x="80" y="260" width="540" height="4" fill="#C41E3A" rx="2"/>
  <text x="100" y="295" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#C41E3A">美以：渗透部署</text>
  <text x="100" y="325" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· SpaceX向美军出售Starshield军事版终端</text>
  <text x="100" y="347" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 冲突开始时已部署于十多个无人机系统</text>
  <text x="100" y="369" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 美国国务院利用"互联网自由倡议"资金</text>
  <text x="100" y="391" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 约6000台Starlink终端走私入境伊朗</text>
  <text x="100" y="413" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 累计估计3万至5万台终端自2022年走私</text>
  
  <!-- Defense side -->
  <rect x="650" y="260" width="550" height="200" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="6"/>
  <rect x="650" y="260" width="550" height="4" fill="#0066CC" rx="2"/>
  <text x="670" y="295" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#0066CC">伊朗：反制行动</text>
  <text x="670" y="325" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 自3月起展开全国性反间谍行动</text>
  <text x="670" y="347" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 宣布没收数百台Starlink终端</text>
  <text x="670" y="369" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 3月19日：逮捕13人，没收5台终端</text>
  <text x="670" y="391" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 3月25日：德黑兰逮捕39人，没收7台</text>
  <text x="670" y="413" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 部署先进射频干扰系统使终端失效</text>
  
  <!-- Symmetry insight -->
  <rect x="80" y="490" width="1120" height="60" fill="#FEF3E8" rx="6"/>
  <rect x="80" y="490" width="6" height="60" fill="#C41E3A"/>
  <text x="110" y="518" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#C41E3A">攻防对称性</text>
  <text x="230" y="518" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#4A5568">进攻方可以利用卫星网络追踪目标，防御方同样可以利用信号特征反向定位并没收设备</text>
  <text x="110" y="538" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">数据对抗时代，没有哪种通信手段能确保100%的安全</text>
  
  <line x1="80" y1="660" x2="1200" y2="660" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="685" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#9CA3AF">来源：公开媒体报道 · 伊朗情报部公告</text>
  <text x="1200" y="685" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#9CA3AF">05 / 信息数据战分析 · 12</text>
  <line x1="80" y1="100" x2="80" y2="115" stroke="#00418D" stroke-width="2"/>
  <line x1="80" y1="100" x2="95" y2="100" stroke="#00418D" stroke-width="2"/>
  <line x1="1200" y1="100" x2="1200" y2="115" stroke="#00418D" stroke-width="2"/>
  <line x1="1200" y1="100" x2="1185" y2="100" stroke="#00418D" stroke-width="2"/>
</svg>