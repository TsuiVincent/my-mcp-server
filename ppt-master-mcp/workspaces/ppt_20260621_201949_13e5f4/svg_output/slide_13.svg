<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00418D"/>
      <stop offset="100%" stop-color="#072C61"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#topBar)"/>
  <rect x="80" y="100" width="4" height="36" fill="#C41E3A"/>
  <text x="100" y="130" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#00418D">三条总体判断</text>
  <text x="100" y="155" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#6B7280">THREE CORE CONCLUSIONS</text>
  <line x1="80" y1="170" x2="1200" y2="170" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Conclusion 1 -->
  <rect x="80" y="200" width="1120" height="120" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="6"/>
  <rect x="80" y="200" width="1120" height="4" fill="#C41E3A" rx="2"/>
  <rect x="100" y="220" width="36" height="36" fill="#C41E3A"/>
  <text x="118" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="160" y="245" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1A202C">从火力密度转向数据定力</text>
  <text x="100" y="275" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#4A5568">谁掌握数据采集、传输、算力和算法，谁就掌握主动权。高精度武器的成本优势建立在数据链优势之上，</text>
  <text x="100" y="297" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#4A5568">若对手具备干扰数据链路的能力，则昂贵弹药将迅速贬值。</text>
  
  <!-- Conclusion 2 -->
  <rect x="80" y="340" width="1120" height="120" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="6"/>
  <rect x="80" y="340" width="1120" height="4" fill="#00418D" rx="2"/>
  <rect x="100" y="360" width="36" height="36" fill="#00418D"/>
  <text x="118" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="160" y="385" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1A202C">民用基础设施即战场延伸</text>
  <text x="100" y="415" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#4A5568">交通摄像头、云数据中心、低轨卫星互联网、手机应用程序——这些日常数字服务，在战时瞬间转化为</text>
  <text x="100" y="437" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#4A5568">情报来源、打击目标和攻防工具。城市智慧化程度越高，战场透明化程度也越高。</text>
  
  <!-- Conclusion 3 -->
  <rect x="80" y="480" width="1120" height="120" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="6"/>
  <rect x="80" y="480" width="1120" height="4" fill="#0066CC" rx="2"/>
  <rect x="100" y="500" width="36" height="36" fill="#0066CC"/>
  <text x="118" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="160" y="525" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1A202C">数据战没有单方面的绝对优势</text>
  <text x="100" y="555" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#4A5568">伊朗以非对称手段打击数据中心、击落无人机、没收星链终端，说明即使是技术弱势一方，也能找到</text>
  <text x="100" y="577" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#4A5568">强者的数据节点实施致命打击。下一次战争的第一声警报，可能不是防空雷达的蜂鸣，而是数据中心的断电报警。</text>
  
  <line x1="80" y1="660" x2="1200" y2="660" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1200" y="685" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#9CA3AF">信息数据战分析 · 13</text>
  <line x1="80" y1="100" x2="80" y2="115" stroke="#00418D" stroke-width="2"/>
  <line x1="80" y1="100" x2="95" y2="100" stroke="#00418D" stroke-width="2"/>
  <line x1="1200" y1="100" x2="1200" y2="115" stroke="#00418D" stroke-width="2"/>
  <line x1="1200" y1="100" x2="1185" y2="100" stroke="#00418D" stroke-width="2"/>
</svg>