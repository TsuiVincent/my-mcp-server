  <circle cx="640" cy="235" r="6" fill="#00418D"/>
  <line x1="610" y1="235" x2="640" y2="235" stroke="#00418D" stroke-width="2"/>
  <text x="110" y="230" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1A202C">一、民用监控系统已成为战略情报源</text>
  <text x="110" y="254" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280">以色列8200部队渗透伊朗交通摄像头 · AI行为模式分析</text>
  
  <!-- Item 2 -->
  <rect x="650" y="200" width="530" height="70" fill="#F4F6F8" rx="4"/>
