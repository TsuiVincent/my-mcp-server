  <text x="100" y="130" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#00418D">目 录</text>
  <text x="100" y="158" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#6B7280">CONTENTS</text>
  <line x1="80" y1="170" x2="1200" y2="170" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- TOC items as connected timeline cards -->
  <!-- Item 1 -->
