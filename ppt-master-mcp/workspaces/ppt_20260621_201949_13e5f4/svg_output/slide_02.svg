  <rect x="80" y="310" width="6" height="70" fill="#00418D"/>
  <circle cx="640" cy="345" r="6" fill="#00418D"/>
  <line x1="610" y1="345" x2="640" y2="345" stroke="#00418D" stroke-width="2"/>
