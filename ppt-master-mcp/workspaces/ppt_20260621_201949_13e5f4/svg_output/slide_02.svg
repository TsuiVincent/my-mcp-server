  <text x="680" y="364" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280">伊朗非对称反击 · 不打航母专打数据中心</text>
  <line x1="640" y1="380" x2="640" y2="415" stroke="#00418D" stroke-width="2"/>
  
  <!-- Item 5 -->
  <rect x="80" y="420" width="530" height="70" fill="#F4F6F8" rx="4"/>
  <rect x="80" y="420" width="6" height="70" fill="#00418D"/>
  <circle cx="640" cy="455" r="6" fill="#00418D"/>
  <line x1="610" y1="455" x2="640" y2="455" stroke="#00418D" stroke-width="2"/>
  <text x="110" y="450" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1A202C">五、没有绝对安全的通信手段</text>
  <text x="110" y="474" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280">星链渗透伊朗 · 射频干扰与全国搜剿</text>
  
  <!-- Summary -->
  <rect x="650" y="420" width="530" height="70" fill="#E8F0FE" rx="4"/>
  <rect x="650" y="420" width="6" height="70" fill="#0066CC"/>
  <text x="680" y="450" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#00418D">三条总体判断</text>
  <text x="680" y="474" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280">从火力密度转向数据定力 · 民用即战场 · 没有绝对优势</text>
  
  <!-- Corner marks -->
  <line x1="80" y1="100" x2="80" y2="120" stroke="#00418D" stroke-width="2"/>
