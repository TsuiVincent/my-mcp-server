  <text x="110" y="364" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280">前六天127亿美元 · 每一枚导弹都是一台会飞的计算机</text>
  
  <!-- Item 4 -->
  <rect x="650" y="310" width="530" height="70" fill="#F4F6F8" rx="4"/>
  <rect x="650" y="310" width="6" height="70" fill="#C41E3A"/>
  <circle cx="640" cy="380" r="6" fill="#C41E3A"/>
