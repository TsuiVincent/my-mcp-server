  <circle cx="640" cy="305" r="6" fill="#C41E3A"/>
  <line x1="640" y1="270" x2="640" y2="305" stroke="#C41E3A" stroke-width="2"/>
  <text x="680" y="230" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1A202C">二、网络阻断已成为开战的"第一枪"</text>
  <text x="680" y="254" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280">伊朗网络流量跌至4% · 数字+物理同步打击</text>
  
  <!-- vertical line connecting -->
  <line x1="640" y1="270" x2="640" y2="305" stroke="#C41E3A" stroke-width="2"/>
  
