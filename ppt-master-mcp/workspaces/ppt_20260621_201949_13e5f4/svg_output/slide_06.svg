  <text x="110" y="538" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6B7280">伊朗国内主流祈祷应用遭劫持，推送心理战信息</text>
  
  <!-- Conclusion -->
  <rect x="80" y="580" width="1120" height="50" fill="#FEF3E8" rx="6"/>
  <rect x="80" y="580" width="6" height="50" fill="#C41E3A"/>
  <text x="110" y="610" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#4A5568">网络战的窗口可能只有数小时，但这数小时足以决定整场战局的走向。关键信息基础设施的供应链安全已与航母同等重要。</text>
  
