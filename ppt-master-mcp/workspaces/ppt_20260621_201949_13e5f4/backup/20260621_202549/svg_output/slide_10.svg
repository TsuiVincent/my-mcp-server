<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00418D"/>
      <stop offset="100%" stop-color="#072C61"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#topBar)"/>
  <rect x="80" y="100" width="4" height="36" fill="#C41E3A"/>
  <text x="100" y="130" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#00418D">AWS数据中心遇袭与非对称反击</text>
  <text x="100" y="155" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#6B7280">CASE STUDY: DATA CENTER STRIKE AND ASYMMETRIC WARFARE</text>
  <line x1="80" y1="170" x2="1200" y2="170" stroke="#E2E8F0" stroke-width="1"/>
  
  <rect x="80" y="190" width="1120" height="44" fill="#F0F4F8" rx="4"/>
  <rect x="80" y="190" width="4" height="44" fill="#C41E3A"/>
  <text x="100" y="218" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#1A202C">核心洞察：摧毁一个算力节点，可能比摧毁十个军事基地更具战略效果</text>
  
  <!-- Left card - Data Center -->
  <rect x="80" y="260" width="540" height="200" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="6"/>
  <rect x="80" y="260" width="540" height="4" fill="#C41E3A" rx="2"/>
  <text x="100" y="295" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#C41E3A">数据中心遭袭（3月1-2日）</text>
  <text x="100" y="325" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· AWS阿联酋 ME-CENTRAL-1 可用区被直接命中</text>
  <text x="100" y="347" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 巴林 ME-SOUTH-1 可用区遭受间接损害</text>
  <text x="100" y="369" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 建筑结构损坏 · 电力中断 · 消防系统误启动</text>
  <text x="100" y="391" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· EC2 / S3 / DynamoDB 等核心服务严重降级</text>
  <text x="100" y="413" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 这些数据中心托管着AI指挥链核心节点</text>
  
  <!-- Right card - Drone -->
  <rect x="650" y="260" width="550" height="200" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="6"/>
  <rect x="650" y="260" width="550" height="4" fill="#0066CC" rx="2"/>
  <text x="670" y="295" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#0066CC">无人机反制</text>
  <text x="670" y="325" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 伊朗防空部队累计击落至少11架</text>
  <text x="670" y="347" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 美军MQ-9"死神"无人机</text>
  <text x="670" y="369" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">· 每架成本约3000万至3500万美元</text>
  
  <!-- Key data -->
  <rect x="80" y="490" width="350" height="60" fill="#F0F4F8" rx="6"/>
  <text x="255" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#C41E3A">≥11</text>
  <text x="255" y="538" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B7280">MQ-9被击落（架）</text>
  
  <rect x="460" y="490" width="350" height="60" fill="#F0F4F8" rx="6"/>
  <text x="635" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#00418D">$3000万</text>
  <text x="635" y="538" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B7280">单架MQ-9成本</text>
  
  <rect x="840" y="490" width="360" height="60" fill="#F0F4F8" rx="6"/>
  <text x="1020" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#C41E3A">3.5亿</text>
  <text x="1020" y="538" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B7280">MQ-9总损失（美元）</text>
  
  <line x1="80" y1="660" x2="1200" y2="660" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="685" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#9CA3AF">来源：AWS官方公告 · 公开军事信息</text>
  <text x="1200" y="685" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#9CA3AF">04 / 信息数据战分析 · 10</text>
  <line x1="80" y1="100" x2="80" y2="115" stroke="#00418D" stroke-width="2"/>
  <line x1="80" y1="100" x2="95" y2="100" stroke="#00418D" stroke-width="2"/>
  <line x1="1200" y1="100" x2="1200" y2="115" stroke="#00418D" stroke-width="2"/>
  <line x1="1200" y1="100" x2="1185" y2="100" stroke="#00418D" stroke-width="2"/>
</svg>