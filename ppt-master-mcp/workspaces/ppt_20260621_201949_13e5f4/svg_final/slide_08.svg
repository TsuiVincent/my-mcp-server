  <text x="100" y="130" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#00418D">从战斧到JDAM：战争的成本逻辑</text>
  <text x="100" y="155" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#6B7280">CASE STUDY: THE COST LOGIC OF PRECISION MUNITIONS</text>
  <line x1="80" y1="170" x2="1200" y2="170" stroke="#E2E8F0" stroke-width="1" />
  
  <path fill="#F0F4F8" d="M84,190 H1196 A4,4 0 0 1 1200,194 V230 A4,4 0 0 1 1196,234 H84 A4,4 0 0 1 80,230 V194 A4,4 0 0 1 84,190 Z" />
  <rect x="80" y="190" width="4" height="44" fill="#C41E3A" />
  <text x="100" y="218" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#1A202C">核心洞察：高精度武器的成本优势建立在数据链优势之上——采购的不是弹药，而是数据终端</text>
  
  
  <path fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" d="M86,260 H604 A6,6 0 0 1 610,266 V414 A6,6 0 0 1 604,420 H86 A6,6 0 0 1 80,414 V266 A6,6 0 0 1 86,260 Z" />
