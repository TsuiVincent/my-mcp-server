  <text x="100" y="295" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#C41E3A">冲突初期：高数据链依赖</text>
  <text x="100" y="325" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">JASSM最新型号：约 230万美元/枚</text>
  <text x="100" y="347" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">战斧巡航导弹：约 200万美元/枚</text>
  <text x="100" y="369" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">内置完整惯导+卫星接收机+地形匹配+末端识别</text>
  <text x="100" y="391" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">需要卫星数据链实时更新目标坐标</text>
  
  <path fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" d="M646,260 H1194 A6,6 0 0 1 1200,266 V414 A6,6 0 0 1 1194,420 H646 A6,6 0 0 1 640,414 V266 A6,6 0 0 1 646,260 Z" />
  <path fill="#0066CC" d="M642,260 H1198 A2,2 0 0 1 1200,262 V262 A2,2 0 0 1 1198,264 H642 A2,2 0 0 1 640,262 V262 A2,2 0 0 1 642,260 Z" />
  <text x="660" y="295" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#0066CC">冲突后期：数据链需求降低</text>
  <text x="660" y="325" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">2000磅 GBU-31：约 10.7万美元/枚</text>
  <text x="660" y="347" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">1000磅 GBU-32：约 7.9万美元/枚</text>
  <text x="660" y="369" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">500磅 GBU-38：约 7.5万美元/枚</text>
  <text x="660" y="391" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4A5568">成本骤降——伊朗防空系统被削弱后复杂数据链需求降低</text>
  
  
  <path fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" d="M86,450 H1194 A6,6 0 0 1 1200,456 V514 A6,6 0 0 1 1194,520 H86 A6,6 0 0 1 80,514 V456 A6,6 0 0 1 86,450 Z" />
