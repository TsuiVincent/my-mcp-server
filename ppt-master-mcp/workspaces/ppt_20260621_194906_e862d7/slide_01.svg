<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F4D"/>
      <stop offset="50%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- 背景 -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <!-- 装饰圆圈 -->
  <circle cx="1100" cy="150" r="180" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="150" cy="600" r="250" fill="#FFFFFF" fill-opacity="0.02"/>
  <circle cx="1200" cy="550" r="120" fill="#FFFFFF" fill-opacity="0.03"/>
  <!-- 左侧亮蓝色装饰条 -->
  <rect x="60" y="0" width="8" height="720" fill="#00B4D8"/>
  <!-- 顶部装饰线 -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentGrad)"/>
  <!-- 标题区域 -->
  <text x="640" y="260" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="46" font-weight="bold" fill="#FFFFFF">关于2026年美以对伊军事冲突中</text>
  <text x="640" y="320" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="46" font-weight="bold" fill="#FFFFFF">信息数据战的分析报告</text>
  <!-- 装饰分割线 -->
  <rect x="440" y="355" width="400" height="3" fill="#00B4D8"/>
  <circle cx="640" cy="356.5" r="6" fill="#00B4D8"/>
  <!-- 副标题 -->
  <text x="640" y="410" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#A0D4FF">数据采集 · 传输 · 处理 · 欺骗与反欺骗的绞杀战</text>
  <text x="640" y="445" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#80BFFF">2026年2月-5月 · "史诗狂怒"行动</text>
  <!-- 演示者/组织信息 -->
  <text x="640" y="530" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#CCE5FF">供内部参阅</text>
  <!-- 底部日期区域 -->
  <rect x="0" y="680" width="1280" height="40" fill="#0050B3" fill-opacity="0.5"/>
  <text x="640" y="706" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#A0D4FF">2026年6月</text>
  <!-- 底部装饰线 -->
  <rect x="0" y="716" width="1280" height="4" fill="#0050B3"/>
</svg>