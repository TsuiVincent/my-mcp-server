<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="chapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B5C"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
    <linearGradient id="glowRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 深蓝色渐变背景 -->
  <rect width="1280" height="720" fill="url(#chapBg)"/>
  <circle cx="950" cy="360" r="350" fill="url(#glowRadial)"/>
  <!-- 左侧红色装饰条 -->
  <rect x="80" y="80" width="6" height="200" fill="#00B4D8"/>
  <!-- 大号半透明章节编号 -->
  <text x="120" y="280" font-family="Arial,sans-serif" font-size="160" font-weight="bold" fill="#FFFFFF" fill-opacity="0.08">01</text>
  <!-- 章节标题 -->
  <text x="120" y="350" font-family="Microsoft YaHei,sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF">民用监控系统</text>
  <text x="120" y="405" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">已成为战略情报源</text>
  <!-- 章节内容 -->
  <text x="120" y="460" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#A0D4FF">交通摄像头 → 全天候瞄准镜</text>
  <text x="120" y="495" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#80BFFF">以色列8200部队长期渗透伊朗监控网络</text>
  <text x="120" y="525" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#80BFFF">AI行为模式分析 → 输出高精度打击坐标</text>
  <!-- 装饰分割线 -->
  <rect x="120" y="560" width="100" height="4" fill="#00B4D8"/>
  <!-- 右侧几何装饰 -->
  <circle cx="1050" cy="200" r="120" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="1150" cy="500" r="80" fill="#FFFFFF" fill-opacity="0.04"/>
  <rect x="1100" y="100" width="2" height="100" fill="#00B4D8" fill-opacity="0.3" transform="rotate(30 1100 100)"/>
  <!-- 底部装饰线 -->
  <rect x="0" y="716" width="1280" height="4" fill="#0050B3"/>
</svg>