<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="40" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="60" y="46" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">一、民用监控系统已成为战略情报源</text>
  <rect x="40" y="70" width="1200" height="50" fill="#E8EEF5"/>
  <rect x="40" y="70" width="4" height="50" fill="#0066CC"/>
  <text x="640" y="101" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#003366" font-weight="bold">核心观点：城市里的交通摄像头，在战时可以变成对手的全天候瞄准镜</text>
  <rect x="40" y="140" width="580" height="200" fill="#F8FAFC" rx="8" stroke="#D0D8E5" stroke-width="1"/>
  <rect x="40" y="140" width="580" height="35" fill="#003366" rx="8"/>
  <rect x="40" y="165" width="580" height="10" fill="#003366"/>
  <text x="330" y="164" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">情报来源</text>
  <line x1="60" y1="195" x2="600" y2="195" stroke="#E0E5EC" stroke-width="1"/>
  <text x="60" y="220" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 以色列8200部队与摩萨德长期潜伏伊朗民用基础设施</text>
  <text x="60" y="245" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 系统性接管交通监控摄像头、市政传感器设备控制权</text>
  <text x="60" y="270" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 实时视频流加密回传至以色列服务器</text>
  <text x="60" y="295" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• AI对海量视频数据进行行为模式分析</text>
  <text x="60" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 识别军官护卫车队路线、人员出入频率、车辆隶属关系</text>
  <rect x="660" y="140" width="580" height="200" fill="#F8FAFC" rx="8" stroke="#D0D8E5" stroke-width="1"/>
  <rect x="660" y="140" width="580" height="35" fill="#CC0000" rx="8"/>
  <rect x="660" y="165" width="580" height="10" fill="#CC0000"/>
  <text x="950" y="164" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">实战效果</text>
  <line x1="680" y1="195" x2="1220" y2="195" stroke="#E0E5EC" stroke-width="1"/>
  <text x="680" y="225" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 2026年2月28日开战当天</text>
  <text x="680" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• AI系统根据多年积累的数据直接输出</text>
  <text x="680" y="275" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">高精度目标坐标</text>
  <text x="680" y="305" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 以军F-15战机约7:30起飞</text>
  <text x="680" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 9:40"蓝麻雀"导弹命中目标</text>
  <rect x="40" y="365" width="1200" height="160" fill="#FFF5F5" rx="8" stroke="#FFD0D0" stroke-width="1"/>
  <rect x="40" y="365" width="6" height="160" fill="#CC0000" rx="3"/>
  <text x="65" y="395" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#CC0000">案例聚焦</text>
  <text x="65" y="425" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">据《金融时报》援引以色列情报官员披露，打击坐标来源于8200部队与摩萨德联合行动多年积累的成果。</text>
  <text x="65" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">路透社2026年3月深度报道证实：以色列多年来对伊朗民用基础设施实施了广泛的网络渗透。</text>
  <text x="65" y="485" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">通过车牌和轨迹推断机构内部的车辆隶属关系，为精确打击提供坐标依据。</text>
  <rect x="40" y="550" width="1200" height="50" fill="#E8F5E9" rx="6" stroke="#A0D8A0" stroke-width="1"/>
  <text x="640" y="580" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">结论：民用监控设施的战时军事价值急剧上升。城市智慧化程度越高，战场透明化程度也越高。</text>
  <rect x="0" y="665" width="1280" height="55" fill="#F0F2F5"/>
  <rect x="40" y="665" width="6" height="55" fill="#CC0000"/>
  <text x="60" y="698" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#666666">第一章 · 情报源分析</text>
  <text x="640" y="698" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#999999">来源：金融时报、路透社2026年3月深度报道</text>
  <text x="1240" y="698" font-family="Arial, sans-serif" font-size="14" fill="#999999" text-anchor="end">3</text>
</svg>