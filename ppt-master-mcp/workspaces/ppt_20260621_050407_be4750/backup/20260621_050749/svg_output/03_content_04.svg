<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="40" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="60" y="46" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">四、算力节点已成为高价值战略目标</text>
  <rect x="40" y="70" width="1200" height="50" fill="#E8EEF5"/>
  <rect x="40" y="70" width="4" height="50" fill="#0066CC"/>
  <text x="640" y="101" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#003366" font-weight="bold">核心观点：面对全世界最强大的军队，伊朗选择非对称反击路线——不打航母，专打数据中心</text>
  <rect x="40" y="140" width="580" height="280" fill="#F8FAFC" rx="8" stroke="#D0D8E5" stroke-width="1"/>
  <rect x="40" y="140" width="580" height="35" fill="#003366" rx="8"/>
  <rect x="40" y="165" width="580" height="10" fill="#003366"/>
  <text x="330" y="164" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">打击数据中心：2026年3月1-2日</text>
  <line x1="60" y1="195" x2="600" y2="195" stroke="#E0E5EC" stroke-width="1"/>
  <text x="60" y="225" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 伊朗无人机对海湾地区基础设施发动袭击</text>
  <text x="60" y="255" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• AWS阿联酋ME-CENTRAL-1可用区被直接命中</text>
  <text x="60" y="285" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• AWS巴林ME-SOUTH-1可用区遭受间接损害</text>
  <text x="60" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#CC0000">AWS官方确认：</text>
  <text x="60" y="350" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">EC2、S3、DynamoDB等核心服务严重降级</text>
  <text x="60" y="385" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#666666" font-style="italic">这些数据中心托管着美军中东地区</text>
  <text x="60" y="405" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#666666">人工智能指挥链的核心节点</text>
  <rect x="660" y="140" width="580" height="280" fill="#F8FAFC" rx="8" stroke="#D0D8E5" stroke-width="1"/>
  <rect x="660" y="140" width="580" height="35" fill="#CC0000" rx="8"/>
  <rect x="660" y="165" width="580" height="10" fill="#CC0000"/>
  <text x="950" y="164" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">击落无人机：非对称消耗战</text>
  <line x1="680" y1="195" x2="1220" y2="195" stroke="#E0E5EC" stroke-width="1"/>
  <text x="680" y="225" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 伊朗防空部队使用AD-08 Majid等系统</text>
  <text x="680" y="255" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 累计击落MQ-9"死神"无人机：</text>
  <text x="950" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#CC0000">≥11架</text>
  <text x="950" y="345" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#666666">每架成本约3000万-3500万美元</text>
  <text x="680" y="385" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">总损失：</text>
  <text x="950" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#CC0000">约3.3亿-3.85亿美元</text>
  <rect x="40" y="445" width="1200" height="50" fill="#E8F5E9" rx="6" stroke="#A0D8A0" stroke-width="1"/>
  <text x="640" y="475" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">结论：数据中心与弹药库、指挥所同等重要。保护数据中心已不仅是商业问题，而是国防问题。</text>
  <rect x="0" y="665" width="1280" height="55" fill="#F0F2F5"/>
  <rect x="40" y="665" width="6" height="55" fill="#CC0000"/>
  <text x="60" y="698" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#666666">第四章 · 算力节点</text>
  <text x="640" y="698" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#999999">来源：AWS官方服务状态公告、公开军事报道</text>
  <text x="1240" y="698" font-family="Arial, sans-serif" font-size="14" fill="#999999" text-anchor="end">9</text>
</svg>