<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="40" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="60" y="46" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">三、战争账单本质上就是数据账单</text>
  <rect x="40" y="70" width="1200" height="50" fill="#E8EEF5"/>
  <rect x="40" y="70" width="4" height="50" fill="#0066CC"/>
  <text x="640" y="101" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#003366" font-weight="bold">核心观点：高精度武器之所以昂贵，不是因为炸药贵，而是因为每一枚导弹都是一台会飞的计算机</text>
  <rect x="40" y="140" width="280" height="140" fill="#FFF5F5" rx="8" stroke="#FFD0D0" stroke-width="1"/>
  <text x="180" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#CC0000">250-290亿</text>
  <text x="180" y="200" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#666666">美元</text>
  <text x="180" y="235" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#333333">前两个月总花费</text>
  <text x="180" y="260" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#666666">日均约4-5亿美元</text>
  <rect x="345" y="140" width="280" height="140" fill="#FFF5F5" rx="8" stroke="#FFD0D0" stroke-width="1"/>
  <text x="485" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#CC0000">＞113亿</text>
  <text x="485" y="200" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#666666">美元</text>
  <text x="485" y="235" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#333333">第一周未预算支出</text>
  <text x="485" y="260" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#666666">CSIS修正约127亿美元</text>
  <rect x="650" y="140" width="280" height="140" fill="#FFF5F5" rx="8" stroke="#FFD0D0" stroke-width="1"/>
  <text x="790" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#CC0000">190-290</text>
  <text x="790" y="200" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#666666">枚</text>
  <text x="790" y="235" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#333333">THAAD消耗≥50%</text>
  <text x="790" y="260" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#666666">库存消耗</text>
  <rect x="955" y="140" width="285" height="140" fill="#FFF5F5" rx="8" stroke="#FFD0D0" stroke-width="1"/>
  <text x="1097" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#CC0000">1060-1430</text>
  <text x="1097" y="200" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#666666">枚</text>
  <text x="1097" y="235" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#333333">Patriot消耗42%-50%</text>
  <text x="1097" y="260" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#666666">拦截弹库存消耗</text>
  <rect x="40" y="300" width="1200" height="190" fill="#F8FAFC" rx="8" stroke="#D0D8E5" stroke-width="1"/>
  <rect x="40" y="300" width="1200" height="35" fill="#003366" rx="8"/>
  <rect x="40" y="325" width="1200" height="10" fill="#003366"/>
  <text x="640" y="324" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">武器成本构成：每一枚导弹都是一台"会飞的计算机"</text>
  <text x="60" y="365" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">战斧巡航导弹（约200万美元/枚）→ 惯性导航+卫星接收机+地形匹配数据库+末端目标识别模块</text>
  <text x="60" y="395" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">JASSM防区外导弹（约230万美元/枚）→ 完整的数据处理与目标识别系统</text>
  <text x="60" y="425" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">后期改用JDAM制导炸弹（7.5万-10.7万美元/枚）→ 随着伊朗防空系统被削弱，成本骤降</text>
  <text x="60" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">每一枚拦截弹依赖地面雷达数据链实时输入 → 拦截成本=数据链成本+弹药成本</text>
  <rect x="40" y="515" width="1200" height="50" fill="#E8F5E9" rx="6" stroke="#A0D8A0" stroke-width="1"/>
  <text x="640" y="545" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">结论：所谓战争烧钱，本质上是烧数据。导弹贵在"计算"，而非炸药。</text>
  <rect x="0" y="665" width="1280" height="55" fill="#F0F2F5"/>
  <rect x="40" y="665" width="6" height="55" fill="#CC0000"/>
  <text x="60" y="698" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#666666">第三章 · 战争成本</text>
  <text x="640" y="698" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#999999">来源：CSIS分析数据、公开军事采购数据</text>
  <text x="1240" y="698" font-family="Arial, sans-serif" font-size="14" fill="#999999" text-anchor="end">7</text>
</svg>