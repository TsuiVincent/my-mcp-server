<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <rect x="0" y="0" width="1280" height="70" fill="#003366" />
  <rect x="40" y="0" width="6" height="70" fill="#CC0000" />
  <text x="60" y="46" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">五、没有绝对安全的通信手段</text>
  <rect x="40" y="70" width="1200" height="50" fill="#E8EEF5" />
  <rect x="40" y="70" width="4" height="50" fill="#0066CC" />
  <text x="640" y="101" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#003366" font-weight="bold">核心观点：美军试图利用星链低轨卫星网络向伊朗境内渗透数据节点，但道高一尺魔高一丈</text>
  <path fill="#F8FAFC" stroke="#D0D8E5" stroke-width="1" d="M48,140 H402 A8,8 0 0 1 410,148 V452 A8,8 0 0 1 402,460 H48 A8,8 0 0 1 40,452 V148 A8,8 0 0 1 48,140 Z" />
  <path fill="#003366" d="M48,140 H402 A8,8 0 0 1 410,148 V167 A8,8 0 0 1 402,175 H48 A8,8 0 0 1 40,167 V148 A8,8 0 0 1 48,140 Z" />
  <rect x="40" y="165" width="370" height="10" fill="#003366" />
  <text x="225" y="164" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">美以方：信道渗透</text>
  <line x1="60" y1="195" x2="390" y2="195" stroke="#E0E5EC" stroke-width="1" />
  <text x="60" y="225" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• SpaceX Starshield军事版终端</text>
  <text x="60" y="255" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">  冲突开始时部署于十多个无人机系统</text>
  <text x="60" y="290" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 2026年1月，美国国务院</text>
  <text x="60" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">  利用"互联网自由倡议"资金</text>
  <text x="60" y="350" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">  将约6000台Starlink终端走私入境</text>
  <text x="60" y="385" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 累计估计有</text>
  <text x="225" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#003366">3万-5万台</text>
  <text x="225" y="450" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#666666">Starlink终端（2022年起）</text>
  <path fill="#FFF5F5" stroke="#FFD0D0" stroke-width="1" d="M463,140 H817 A8,8 0 0 1 825,148 V452 A8,8 0 0 1 817,460 H463 A8,8 0 0 1 455,452 V148 A8,8 0 0 1 463,140 Z" />
  <path fill="#CC0000" d="M463,140 H817 A8,8 0 0 1 825,148 V167 A8,8 0 0 1 817,175 H463 A8,8 0 0 1 455,167 V148 A8,8 0 0 1 463,140 Z" />
  <rect x="455" y="165" width="370" height="10" fill="#CC0000" />
  <text x="640" y="164" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">伊朗方：反制行动</text>
  <line x1="475" y1="195" x2="805" y2="195" stroke="#E0E5EC" stroke-width="1" />
  <text x="475" y="225" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 伊朗情报部自3月起展开</text>
  <text x="475" y="255" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">  全国性反间谍行动</text>
  <text x="475" y="290" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 宣布没收数百台Starlink终端</text>
  <text x="475" y="325" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 3月19日逮捕13名</text>
  <text x="475" y="355" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">  "以色列支持的间谍网络"成员</text>
  <text x="475" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 3月25日在德黑兰逮捕39人</text>
  <text x="475" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">  没收7台Starlink设备</text>
  <text x="475" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 部署先进射频干扰系统</text>
  <text x="475" y="480" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">  对Starlink信号实施军事级干扰</text>
  <path fill="#F0F4FA" stroke="#B0C8E0" stroke-width="1" d="M878,140 H1232 A8,8 0 0 1 1240,148 V452 A8,8 0 0 1 1232,460 H878 A8,8 0 0 1 870,452 V148 A8,8 0 0 1 878,140 Z" />
  <path fill="#0066CC" d="M878,140 H1232 A8,8 0 0 1 1240,148 V167 A8,8 0 0 1 1232,175 H878 A8,8 0 0 1 870,167 V148 A8,8 0 0 1 878,140 Z" />
  <rect x="870" y="165" width="370" height="10" fill="#0066CC" />
  <text x="1055" y="164" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">博弈分析</text>
  <line x1="890" y1="195" x2="1220" y2="195" stroke="#E0E5EC" stroke-width="1" />
  <text x="890" y="235" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">技术优势 ≠ 绝对安全</text>
  <text x="890" y="270" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">低轨卫星互联网的弱点：</text>
  <text x="890" y="300" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 地面终端可被物理没收</text>
  <text x="890" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 射频信号可被军事级干扰</text>
  <text x="890" y="360" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">• 走私渠道可被情报阻断</text>
  <text x="890" y="395" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333" font-weight="bold">关键教训：</text>
  <text x="890" y="425" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">数据内容可以加密，</text>
  <text x="890" y="450" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">但"正在通信"</text>
  <text x="890" y="475" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#333333">这一事实无法隐藏</text>
  <path fill="#E8F5E9" stroke="#A0D8A0" stroke-width="1" d="M46,485 H1234 A6,6 0 0 1 1240,491 V529 A6,6 0 0 1 1234,535 H46 A6,6 0 0 1 40,529 V491 A6,6 0 0 1 46,485 Z" />
  <text x="640" y="515" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">结论：数据可以加密，但"正在通信"这一事实无法隐藏。没有绝对安全的通信手段。</text>
  <rect x="0" y="665" width="1280" height="55" fill="#F0F2F5" />
  <rect x="40" y="665" width="6" height="55" fill="#CC0000" />
  <text x="60" y="698" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#666666">第五章 · 通信安全</text>
  <text x="640" y="698" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#999999">来源：SpaceX公开信息、伊朗情报部公告</text>
  <text x="1240" y="698" font-family="Arial, sans-serif" font-size="14" fill="#999999" text-anchor="end">11</text>
</svg>