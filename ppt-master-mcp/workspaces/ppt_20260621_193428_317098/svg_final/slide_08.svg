  <text x="80" y="498" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#0050B3">🔑 核心启示</text>
  <text x="80" y="522" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">低轨卫星通信（如Starlink）为战场数据渗透提供了新的可能性，但任何通信手段都存在被干扰、被没收、被利用的风险。</text>
