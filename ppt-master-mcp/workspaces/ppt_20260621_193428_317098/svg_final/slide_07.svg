  <rect x="60" y="235" width="560" height="10" fill="#C00000" />
  <text x="340" y="231" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">⚡ 数据中心袭击</text>

  <path fill="#FFFFFF" stroke="#E0E8F0" stroke-width="1" d="M96,265 H324 A6,6 0 0 1 330,271 V329 A6,6 0 0 1 324,335 H96 A6,6 0 0 1 90,329 V271 A6,6 0 0 1 96,265 Z" />
  <text x="210" y="293" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#C00000">AWS ME-CENTRAL-1</text>
  <text x="210" y="318" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#666666">阿联酋可用区被命中</text>

  <path fill="#FFFFFF" stroke="#E0E8F0" stroke-width="1" d="M356,265 H584 A6,6 0 0 1 590,271 V329 A6,6 0 0 1 584,335 H356 A6,6 0 0 1 350,329 V271 A6,6 0 0 1 356,265 Z" />
  <text x="470" y="293" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#C00000">AWS ME-SOUTH-1</text>
  <text x="470" y="318" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#666666">巴林可用区遭损害</text>

  <text x="90" y="380" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">这些数据中心托管着美军中东地区</text>
  <text x="90" y="400" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#C00000">人工智能指挥链的核心节点</text>
  <text x="90" y="420" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#999999">目标选择精准体现了对美军作战体系数据流的深刻理解</text>

  
  <path fill="#FAFCFF" stroke="#E0E8F0" stroke-width="1" d="M670,205 H1210 A10,10 0 0 1 1220,215 V425 A10,10 0 0 1 1210,435 H670 A10,10 0 0 1 660,425 V215 A10,10 0 0 1 670,205 Z" />
  <path fill="#0050B3" d="M670,205 H1210 A10,10 0 0 1 1220,215 V235 A10,10 0 0 1 1210,245 H670 A10,10 0 0 1 660,235 V215 A10,10 0 0 1 670,205 Z" />
  <rect x="660" y="235" width="560" height="10" fill="#0050B3" />
  <text x="940" y="231" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">🛩 无人机损失统计</text>

  <path fill="#FFFFFF" stroke="#E0E8F0" stroke-width="1" d="M708,270 H1172 A8,8 0 0 1 1180,278 V322 A8,8 0 0 1 1172,330 H708 A8,8 0 0 1 700,322 V278 A8,8 0 0 1 708,270 Z" />
  <text x="940" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#C00000">11架</text>
  <text x="940" y="320" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">MQ-9"死神"无人机被击落</text>

  <text x="700" y="360" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">• 每架MQ-9成本：约 <tspan fill="#C00000" font-weight="bold">3000万至3500万美元</tspan></text>
  <text x="700" y="385" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">• 来源：Aviation Safety Network 记录</text>
  <text x="700" y="410" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">• 加上无人机损失，美军的实际战争成本显著攀升</text>

  
  <path fill="#FFF8F0" stroke="#FFB347" stroke-opacity="0.3" stroke-width="1" d="M68,460 H1212 A8,8 0 0 1 1220,468 V532 A8,8 0 0 1 1212,540 H68 A8,8 0 0 1 60,532 V468 A8,8 0 0 1 68,460 Z" />
  <text x="80" y="490" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#D47400">💡 非对称打击逻辑</text>
  <text x="80" y="512" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">摧毁一个数据中心的效果，可能超过击沉一艘航母——因为它瘫痪的是整个指挥链条的"大脑"。技术弱势一方同样能找到强者数据节点的致命弱点。</text>

  
  <path fill="#F0F6FF" d="M68,565 H1212 A8,8 0 0 1 1220,573 V607 A8,8 0 0 1 1212,615 H68 A8,8 0 0 1 60,607 V573 A8,8 0 0 1 68,565 Z" />
  <text x="640" y="595" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">战争成本计算：11架MQ-9 × $3,250万 ≈ $3.57亿（仅无人机损失）</text>

