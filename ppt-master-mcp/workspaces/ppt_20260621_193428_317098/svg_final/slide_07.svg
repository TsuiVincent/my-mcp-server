  <text x="80" y="148" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#333333">核心论点：面对全世界最强大的军队，伊朗选择了一条非对称反击路线——不打航母，专打数据中心。</text>
  <text x="80" y="170" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#666666">2026年3月1日至2日，伊朗无人机对海湾地区基础设施发动袭击</text>

  
  <path fill="#FAFCFF" stroke="#E0E8F0" stroke-width="1" d="M70,205 H610 A10,10 0 0 1 620,215 V425 A10,10 0 0 1 610,435 H70 A10,10 0 0 1 60,425 V215 A10,10 0 0 1 70,205 Z" />
