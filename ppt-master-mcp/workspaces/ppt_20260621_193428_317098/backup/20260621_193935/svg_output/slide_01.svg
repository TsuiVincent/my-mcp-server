<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="50%" stop-color="#132B50"/>
      <stop offset="100%" stop-color="#1A3D6D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <!-- Top decoration line -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentGrad)"/>
  <!-- Left accent bar -->
  <rect x="80" y="0" width="6" height="720" fill="#00B4D8" fill-opacity="0.25"/>
  <!-- Decorative circles -->
  <circle cx="1100" cy="150" r="180" fill="#FFFFFF" fill-opacity="0.03"/>
  <circle cx="1050" cy="200" r="120" fill="#00B4D8" fill-opacity="0.05"/>
  <circle cx="200" cy="600" r="100" fill="#0050B3" fill-opacity="0.08"/>
  <!-- Decorative tech lines -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="#00B4D8" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="110" x2="350" y2="110" stroke="#00B4D8" stroke-opacity="0.05" stroke-width="1"/>
  <!-- Main title -->
  <text x="640" y="280" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="46" font-weight="bold" fill="#FFFFFF">关于2026年美以对伊军事冲突中</text>
  <text x="640" y="342" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="46" font-weight="bold" fill="#FFFFFF">信息数据战的分析报告</text>
  <!-- Decorative divider -->
  <rect x="540" y="390" width="200" height="3" fill="#00B4D8"/>
  <circle cx="530" cy="391" r="5" fill="#00B4D8"/>
  <circle cx="750" cy="391" r="5" fill="#00B4D8"/>
  <!-- Subtitle -->
  <text x="640" y="445" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#8AB4F8">（供内部参阅）</text>
  <!-- Bottom info area -->
  <rect x="540" y="560" width="200" height="2" fill="#FFFFFF" fill-opacity="0.15"/>
  <text x="640" y="600" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#8AB4F8">2026年6月</text>
  <!-- Bottom decoration line -->
  <rect x="0" y="716" width="1280" height="4" fill="#0050B3"/>
</svg>