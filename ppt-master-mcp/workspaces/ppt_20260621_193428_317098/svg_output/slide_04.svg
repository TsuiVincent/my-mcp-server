<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
  </defs>
  <!-- White background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Top decoration line -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#topBar)"/>
  <!-- Number block + title -->
  <rect x="60" y="36" width="50" height="50" fill="#0050B3" rx="4"/>
  <text x="85" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">01</text>
  <text x="130" y="70" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#1A1A1A">民用监控系统已成为战略情报源</text>
  <!-- Divider line -->
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#E0E8F0" stroke-width="1"/>
  
  <!-- Key message bar -->
  <rect x="60" y="120" width="1160" height="60" fill="#F0F6FF" rx="8"/>
  <rect x="60" y="120" width="4" height="60" fill="#00B4D8" rx="2"/>
  <text x="80" y="155" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#333333">核心论点：城市里的交通摄像头，原本用于治安管理，但在战时可以变成对手的全天候瞄准镜。</text>

  <!-- Left column: Case study -->
  <rect x="60" y="200" width="560" height="280" fill="#FAFCFF" rx="10" stroke="#E0E8F0" stroke-width="1"/>
  <rect x="60" y="200" width="560" height="40" fill="#0050B3" rx="10"/>
  <rect x="60" y="230" width="560" height="10" fill="#0050B3"/>
  <text x="340" y="226" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">🎯 典型案例</text>
  
  <circle cx="85" cy="270" r="4" fill="#00B4D8"/>
  <text x="100" y="275" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">2026年2月28日开战当天</text>
  <text x="100" y="298" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">以色列空军对德黑兰多个目标实施精确打击</text>
  <text x="100" y="318" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">—— 军官住所、革命卫队指挥点等</text>
  
  <circle cx="85" cy="350" r="4" fill="#00B4D8"/>
  <text x="100" y="355" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">情报来源：8200部队 + 摩萨德</text>
  <text x="100" y="378" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">多年网络渗透伊朗民用监控基础设施</text>
  <text x="100" y="398" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">AI算法分析海量视频 → 行为模式识别</text>
  
  <circle cx="85" cy="430" r="4" fill="#00B4D8"/>
  <text x="100" y="435" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A">来源：金融时报/路透社</text>
  <text x="100" y="458" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">多名以色列情报官员披露证实</text>

  <!-- Right column: Analysis & conclusion -->
  <rect x="660" y="200" width="560" height="280" fill="#F8FBFF" rx="10" stroke="#00B4D8" stroke-opacity="0.2" stroke-width="2"/>
  <rect x="660" y="200" width="560" height="40" fill="#00B4D8" rx="10"/>
  <rect x="660" y="230" width="560" height="10" fill="#00B4D8"/>
  <text x="940" y="226" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">📋 战略分析</text>

  <rect x="690" y="265" width="500" height="45" fill="#FFFFFF" rx="6" stroke="#E0E8F0" stroke-width="1"/>
  <text x="705" y="293" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#333333">民用监控设施的战时军事价值急剧上升</text>
  
  <rect x="690" y="325" width="500" height="45" fill="#FFFFFF" rx="6" stroke="#E0E8F0" stroke-width="1"/>
  <text x="705" y="353" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#333333">城市智慧化程度越高，战场透明化程度越高</text>
  
  <rect x="690" y="385" width="500" height="45" fill="#FFFFFF" rx="6" stroke="#E0E8F0" stroke-width="1"/>
  <text x="705" y="413" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#333333">密码管理 + 固件更新 + 网络隔离 = 必备防御</text>

  <!-- Warning box -->
  <rect x="690" y="450" width="500" height="80" fill="#FFF8F0" rx="8" stroke="#FFB347" stroke-opacity="0.5" stroke-width="1"/>
  <text x="705" y="478" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#D47400">⚠ 防御要点</text>
  <text x="705" y="500" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#666666">"城市安全"与"战场透明"仅一线之隔</text>
  <text x="705" y="520" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#666666">—— 网络渗透是长期、系统性的，而非临时起意</text>

  <!-- Footer -->
  <rect x="60" y="665" width="1160" height="1" fill="#E0E8F0"/>
  <text x="60" y="690" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#999999">来源：金融时报 · 路透社 2026年3月深度报道</text>
  <text x="1220" y="690" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#0050B3">04</text>
  <!-- Bottom line -->
  <rect x="0" y="716" width="1280" height="4" fill="#0050B3"/>
</svg>