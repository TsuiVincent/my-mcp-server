<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#topBar)"/>
  <rect x="60" y="36" width="50" height="50" fill="#0050B3" rx="4"/>
  <text x="85" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">02</text>
  <text x="130" y="70" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#1A1A1A">网络阻断已成为开战的"第一枪"</text>
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#E0E8F0" stroke-width="1"/>
  <rect x="60" y="120" width="1160" height="60" fill="#F0F6FF" rx="8"/>
  <rect x="60" y="120" width="4" height="60" fill="#00B4D8" rx="2"/>
  <text x="80" y="155" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#333333">核心论点：先切断对手的数据神经，再实施物理打击，已经成为现代战争的标准起手式。</text>

  <!-- Left: Data visualization card -->
  <rect x="60" y="200" width="560" height="300" fill="#F8FBFF" rx="10" stroke="#00B4D8" stroke-opacity="0.15" stroke-width="2"/>
  <text x="340" y="235" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#0050B3">📉 网络流量断崖式下跌</text>
  <!-- Chart area -->
  <rect x="90" y="260" width="240" height="160" fill="#FFFFFF" rx="8" stroke="#E0E8F0" stroke-width="1"/>
  <text x="210" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#C00000">98%</text>
  <text x="210" y="315" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#666666">全国流量下降</text>
  <line x1="110" y1="340" x2="310" y2="340" stroke="#E0E8F0" stroke-width="1"/>
  <rect x="110" y="358" width="40" height="40" fill="#00B4D8" rx="4"/>
  <text x="130" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">4%</text>
  <text x="165" y="383" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#555555">最低至正常水平</text>
  
  <rect x="350" y="260" width="240" height="160" fill="#FFFFFF" rx="8" stroke="#E0E8F0" stroke-width="1"/>
  <text x="470" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#0050B3">7:00</text>
  <text x="470" y="315" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#666666">UTC 开战时间</text>
  <line x1="370" y1="340" x2="570" y2="340" stroke="#E0E8F0" stroke-width="1"/>
  <rect x="370" y="358" width="200" height="40" fill="#0050B3" rx="4"/>
  <text x="470" y="383" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">NetBlocks / Cloudflare Radar</text>

  <!-- Right: Case & Analysis -->
  <rect x="660" y="200" width="560" height="140" fill="#FAFCFF" rx="10" stroke="#E0E8F0" stroke-width="1"/>
  <rect x="660" y="200" width="560" height="35" fill="#0050B3" rx="10"/>
  <rect x="660" y="225" width="560" height="10" fill="#0050B3"/>
  <text x="940" y="223" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">🔍 数据来源</text>
  <text x="690" y="265" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">• 国际互联网监测组织 NetBlocks 实时数据</text>
  <text x="690" y="288" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">• Cloudflare Radar 同步确认</text>
  <text x="690" y="311" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">• 德黑兰、法尔斯、伊斯法罕等主要省份流量接近归零</text>

  <!-- Analysis card -->
  <rect x="660" y="360" width="560" height="140" fill="#FAFCFF" rx="10" stroke="#E0E8F0" stroke-width="1"/>
  <rect x="660" y="360" width="560" height="35" fill="#00B4D8" rx="10"/>
  <rect x="660" y="385" width="560" height="10" fill="#00B4D8"/>
  <text x="940" y="383" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">📊 多维分析</text>
  <text x="690" y="418" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">• 伊朗当局主动切网以阻断外部侦察和内部协调</text>
  <text x="690" y="441" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">• 美以在网络空间的攻击与军事打击同步展开</text>
  <text x="690" y="464" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">• 结论：伊朗在首波打击中几乎丧失对外信息输出</text>
  <text x="690" y="487" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#555555">  和内部应急指挥的可靠带宽</text>

  <!-- Footer -->
  <rect x="60" y="665" width="1160" height="1" fill="#E0E8F0"/>
  <text x="60" y="690" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#999999">来源：NetBlocks · Cloudflare Radar 公开遥测数据</text>
  <text x="1220" y="690" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#0050B3">05</text>
  <rect x="0" y="716" width="1280" height="4" fill="#0050B3"/>
</svg>