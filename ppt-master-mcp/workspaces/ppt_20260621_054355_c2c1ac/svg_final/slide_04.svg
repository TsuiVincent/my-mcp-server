  <text x="85" y="428" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="bold" fill="#C00000">结论</text>
  <text x="155" y="428" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">网络战的窗口可能只有数小时，但这数小时足以决定整场战局的走向。</text>
  <text x="85" y="451" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#666666">关键信息基础设施的供应链安全和主动防御能力，已与航母、战斗机同等重要</text>
  <path fill="#F2F2F2" d="M68,485 H1202 A8,8 0 0 1 1210,493 V612 A8,8 0 0 1 1202,620 H68 A8,8 0 0 1 60,612 V493 A8,8 0 0 1 68,485 Z" />
  <rect x="85" y="505" width="30" height="30" fill="#C00000" />
  <text x="100" y="527" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="135" y="525" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="bold" fill="#000000">核心启示</text>
  <text x="85" y="558" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#333333">• 网络阻断与物理打击同步，数字空间已成为独立战场维度</text>
  <text x="85" y="582" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#333333">• 社交媒体和民用应用可能被武器化，成为心理战工具</text>
  <text x="85" y="606" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#333333">• 国家需建立网络空间主动防御体系，确保关键通信链路冗余</text>
