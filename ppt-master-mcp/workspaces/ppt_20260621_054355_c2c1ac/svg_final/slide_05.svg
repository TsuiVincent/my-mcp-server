<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <rect x="0" y="0" width="1280" height="4" fill="#C00000" />
  <rect x="30" y="20" width="10" height="40" fill="#C00000" />
  <text x="50" y="52" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="bold" fill="#C00000">战争账单本质上就是数据账单</text>
  <rect x="30" y="80" width="1220" height="60" fill="#F2F2F2" />
  <text x="640" y="116" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#000000" text-anchor="middle">高精度武器之所以昂贵，不是因为炸药贵，而是因为每一枚导弹都是一台会飞的计算机</text>
  <rect x="30" y="155" width="1220" height="490" fill="none" stroke="#C00000" stroke-width="2" stroke-dasharray="5 5" />
  <path fill="#F2F2F2" d="M68,180 H422 A8,8 0 0 1 430,188 V302 A8,8 0 0 1 422,310 H68 A8,8 0 0 1 60,302 V188 A8,8 0 0 1 68,180 Z" />
  <path fill="#C00000" d="M63,180 H63 A3,3 0 0 1 66,183 V307 A3,3 0 0 1 63,310 H63 A3,3 0 0 1 60,307 V183 A3,3 0 0 1 63,180 Z" />
  <text x="245" y="210" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#C00000" text-anchor="middle">250~290亿</text>
  <text x="245" y="240" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#666666" text-anchor="middle">前两个月总花费（美元）</text>
  <text x="245" y="265" font-family="Arial,sans-serif" font-size="16" fill="#333333" text-anchor="middle">日均约 4~5 亿美元</text>
  <path fill="#F2F2F2" d="M463,180 H817 A8,8 0 0 1 825,188 V302 A8,8 0 0 1 817,310 H463 A8,8 0 0 1 455,302 V188 A8,8 0 0 1 463,180 Z" />
  <path fill="#C00000" d="M458,180 H458 A3,3 0 0 1 461,183 V307 A3,3 0 0 1 458,310 H458 A3,3 0 0 1 455,307 V183 A3,3 0 0 1 458,180 Z" />
  <text x="640" y="210" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#C00000" text-anchor="middle">21亿</text>
  <text x="640" y="240" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#666666" text-anchor="middle">前六天日均花费（美元）</text>
  <text x="640" y="265" font-family="Arial,sans-serif" font-size="16" fill="#333333" text-anchor="middle">首周未预算支出113~127亿美元</text>
  <path fill="#F2F2F2" d="M858,180 H1212 A8,8 0 0 1 1220,188 V302 A8,8 0 0 1 1212,310 H858 A8,8 0 0 1 850,302 V188 A8,8 0 0 1 858,180 Z" />
  <path fill="#C00000" d="M853,180 H853 A3,3 0 0 1 856,183 V307 A3,3 0 0 1 853,310 H853 A3,3 0 0 1 850,307 V183 A3,3 0 0 1 853,180 Z" />
  <text x="1035" y="210" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#C00000" text-anchor="middle">230万</text>
  <text x="1035" y="240" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#666666" text-anchor="middle">JASSM导弹单价（美元）</text>
  <text x="1035" y="265" font-family="Arial,sans-serif" font-size="16" fill="#333333" text-anchor="middle">战斧巡航导弹约200万美元</text>
  <path fill="#F2F2F2" d="M68,330 H602 A8,8 0 0 1 610,338 V442 A8,8 0 0 1 602,450 H68 A8,8 0 0 1 60,442 V338 A8,8 0 0 1 68,330 Z" />
  <path fill="#2E75B6" d="M63,330 H63 A3,3 0 0 1 66,333 V447 A3,3 0 0 1 63,450 H63 A3,3 0 0 1 60,447 V333 A3,3 0 0 1 63,330 Z" />
  <path fill="#2E75B6" d="M89,345 H131 A4,4 0 0 1 135,349 V369 A4,4 0 0 1 131,373 H89 A4,4 0 0 1 85,369 V349 A4,4 0 0 1 89,345 Z" />
  <text x="110" y="365" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">数据</text>
  <text x="150" y="365" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="bold" fill="#000000">防空拦截弹消耗</text>
  <text x="85" y="395" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#333333">• THAAD消耗至少50%（约190~290枚）</text>
  <text x="85" y="418" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#333333">• Patriot拦截弹消耗42%~50%（约1060~1430枚）</text>
  <text x="85" y="441" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#666666">补充周期长达4~6年</text>
  <path fill="#F2F2F2" d="M668,330 H1202 A8,8 0 0 1 1210,338 V442 A8,8 0 0 1 1202,450 H668 A8,8 0 0 1 660,442 V338 A8,8 0 0 1 668,330 Z" />
  <path fill="#2E75B6" d="M663,330 H663 A3,3 0 0 1 666,333 V447 A3,3 0 0 1 663,450 H663 A3,3 0 0 1 660,447 V333 A3,3 0 0 1 663,330 Z" />
  <path fill="#2E75B6" d="M689,345 H731 A4,4 0 0 1 735,349 V369 A4,4 0 0 1 731,373 H689 A4,4 0 0 1 685,369 V349 A4,4 0 0 1 689,345 Z" />
  <text x="710" y="365" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">分析</text>
  <text x="750" y="365" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="bold" fill="#000000">导弹=会飞的计算机</text>
  <text x="685" y="395" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#333333">• 惯性导航+卫星接收+地形匹配数据库</text>
  <text x="685" y="418" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#333333">• 末端目标识别模块</text>
  <text x="685" y="441" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#333333">• JDAM制导炸弹后期使用（7.5~10.7万美元）</text>
  <path fill="#FDF3EB" stroke="#F8CBAD" stroke-width="2" d="M68,470 H1202 A8,8 0 0 1 1210,478 V522 A8,8 0 0 1 1202,530 H68 A8,8 0 0 1 60,522 V478 A8,8 0 0 1 68,470 Z" />
  <path fill="#C00000" d="M63,470 H63 A3,3 0 0 1 66,473 V527 A3,3 0 0 1 63,530 H63 A3,3 0 0 1 60,527 V473 A3,3 0 0 1 63,470 Z" />
  <text x="85" y="493" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="bold" fill="#C00000">结论</text>
  <text x="155" y="493" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">所谓战争烧钱，本质上是烧数据。高精度武器的成本优势建立在数据链优势之上。</text>
  <text x="85" y="516" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#666666">数据链优势能降低拦截成本，提升打击效率</text>
  <rect x="30" y="660" width="1220" height="40" fill="#F2F2F2" />
  <rect x="30" y="660" width="6" height="40" fill="#C00000" />
  <text x="50" y="686" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#666666">信息数据战分析报告 · 三、战争账单本质上就是数据账单</text>
  <rect x="1205" y="665" width="25" height="25" fill="#C00000" />
  <text x="1217" y="684" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
