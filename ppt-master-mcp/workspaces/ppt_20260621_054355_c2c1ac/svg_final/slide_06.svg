  <path fill="#2E75B6" d="M689,195 H731 A4,4 0 0 1 735,199 V219 A4,4 0 0 1 731,223 H689 A4,4 0 0 1 685,219 V199 A4,4 0 0 1 689,195 Z" />
  <text x="710" y="215" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">数据</text>
  <text x="750" y="215" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="bold" fill="#000000">MQ-9无人机被击落</text>
  <text x="685" y="248" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">伊朗防空部队多次击落美军</text>
  <text x="685" y="270" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">MQ-9"死神"无人机：</text>
  <text x="685" y="295" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">• 累计至少</text>
  <text x="795" y="295" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#C00000">11</text>
  <text x="815" y="295" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">架</text>
  <text x="685" y="320" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">• 每架MQ-9成本约</text>
  <text x="895" y="320" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#C00000">3000~3500万美元</text>
  <text x="685" y="350" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">来源：Aviation Safety Network记录</text>
