<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#C00000"/>
  <rect x="30" y="20" width="10" height="40" fill="#C00000"/>
  <text x="50" y="52" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="bold" fill="#C00000">总结：三条总体判断</text>
  <rect x="30" y="80" width="1220" height="60" fill="#F2F2F2"/>
  <text x="640" y="116" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#000000" text-anchor="middle">综合五个维度的分析，归纳以下三条核心判断</text>
  <rect x="30" y="155" width="1220" height="490" fill="none" stroke="#C00000" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="60" y="180" width="1150" height="120" rx="8" fill="#FDF3EB" stroke="#F8CBAD" stroke-width="2"/>
  <rect x="60" y="180" width="8" height="120" rx="3" fill="#C00000"/>
  <rect x="95" y="200" width="40" height="40" fill="#C00000"/>
  <text x="115" y="228" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="155" y="220" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="bold" fill="#C00000">从火力密度转向数据定力</text>
  <text x="95" y="252" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#333333">谁掌握数据采集、传输、算力和算法，谁就掌握主动权。高精度武器的成本优势建立在数据链优势之上，</text>
  <text x="95" y="278" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#333333">战争烧钱本质上是在烧数据。</text>
  <rect x="60" y="320" width="1150" height="120" rx="8" fill="#FDF3EB" stroke="#F8CBAD" stroke-width="2"/>
  <rect x="60" y="320" width="8" height="120" rx="3" fill="#2E75B6"/>
  <rect x="95" y="340" width="40" height="40" fill="#2E75B6"/>
  <text x="115" y="368" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="155" y="360" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="bold" fill="#2E75B6">民用基础设施即战场延伸</text>
  <text x="95" y="392" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#333333">交通摄像头、云数据中心、低轨卫星互联网、手机应用程序这些日常数字服务，在战时瞬间转化为</text>
  <text x="95" y="418" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#333333">情报来源、打击目标和攻防工具。"城市安全"与"战场透明"仅一线之隔。</text>
  <rect x="60" y="460" width="1150" height="120" rx="8" fill="#FDF3EB" stroke="#F8CBAD" stroke-width="2"/>
  <rect x="60" y="460" width="8" height="120" rx="3" fill="#C00000"/>
  <rect x="95" y="480" width="40" height="40" fill="#C00000"/>
  <text x="115" y="508" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="155" y="500" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="bold" fill="#C00000">数据战没有单方面的绝对优势</text>
  <text x="95" y="532" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#333333">伊朗以非对称手段打击数据中心、击落无人机、没收星链终端，说明即使是技术弱势一方，</text>
  <text x="95" y="558" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#333333">也能找到强者的数据节点实施致命打击。在算法面前，没有谁是无法被分析的。</text>
  <rect x="30" y="660" width="1220" height="40" fill="#F2F2F2"/>
  <rect x="30" y="660" width="6" height="40" fill="#C00000"/>
  <text x="50" y="686" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#666666">信息数据战分析报告 · 总结：三条总体判断</text>
  <rect x="1205" y="665" width="25" height="25" fill="#C00000"/>
  <text x="1217" y="684" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text>
</svg>