<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#C00000"/>
  <rect x="30" y="20" width="10" height="40" fill="#C00000"/>
  <text x="50" y="52" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="bold" fill="#C00000">网络阻断已成为开战的"第一枪"</text>
  <rect x="30" y="80" width="1220" height="60" fill="#F2F2F2"/>
  <text x="640" y="116" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#000000" text-anchor="middle">先切断对手的数据神经，再实施物理打击——现代战争的标准起手式</text>
  <rect x="30" y="155" width="1220" height="490" fill="none" stroke="#C00000" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="60" y="180" width="550" height="200" rx="8" fill="#F2F2F2"/>
  <rect x="60" y="180" width="6" height="200" rx="3" fill="#C00000"/>
  <rect x="85" y="195" width="50" height="28" rx="4" fill="#C00000"/>
  <text x="110" y="215" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">数据</text>
  <text x="150" y="215" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="bold" fill="#000000">断崖式断网</text>
  <text x="85" y="248" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">2026年2月28日约7:00 UTC，伊朗全国</text>
  <text x="85" y="270" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">互联网流量断崖式下跌，最低降至</text>
  <text x="85" y="292" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">正常水平的约</text>
  <text x="210" y="292" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#C00000">4%</text>
  <text x="85" y="318" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">Cloudflare Radar确认：较前一周下降约</text>
  <text x="85" y="340" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">98%</text>
  <text x="130" y="340" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#666666">，德黑兰等地接近归零</text>
  <rect x="660" y="180" width="550" height="200" rx="8" fill="#F2F2F2"/>
  <rect x="660" y="180" width="6" height="200" rx="3" fill="#2E75B6"/>
  <rect x="685" y="195" width="50" height="28" rx="4" fill="#2E75B6"/>
  <text x="710" y="215" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">攻击</text>
  <text x="750" y="215" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="bold" fill="#000000">多维网络攻击</text>
  <text x="685" y="248" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">• 伊朗当局主动切网阻断外部侦察</text>
  <text x="685" y="270" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">• 通讯社IRNA、塔斯尼姆等遭入侵</text>
  <text x="685" y="292" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">• BadeSaba祈祷应用被劫持</text>
  <text x="685" y="314" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">• 推送心理战信息</text>
  <rect x="60" y="405" width="1150" height="60" rx="8" fill="#FDF3EB" stroke="#F8CBAD" stroke-width="2"/>
  <rect x="60" y="405" width="6" height="60" rx="3" fill="#C00000"/>
  <text x="85" y="428" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="bold" fill="#C00000">结论</text>
  <text x="155" y="428" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">网络战的窗口可能只有数小时，但这数小时足以决定整场战局的走向。</text>
  <text x="85" y="451" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#666666">关键信息基础设施的供应链安全和主动防御能力，已与航母、战斗机同等重要</text>
  <rect x="60" y="485" width="1150" height="135" rx="8" fill="#F2F2F2"/>
  <rect x="85" y="505" width="30" height="30" fill="#C00000"/>
  <text x="100" y="527" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="135" y="525" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="bold" fill="#000000">核心启示</text>
  <text x="85" y="558" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#333333">• 网络阻断与物理打击同步，数字空间已成为独立战场维度</text>
  <text x="85" y="582" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#333333">• 社交媒体和民用应用可能被武器化，成为心理战工具</text>
  <text x="85" y="606" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#333333">• 国家需建立网络空间主动防御体系，确保关键通信链路冗余</text>
  <rect x="30" y="660" width="1220" height="40" fill="#F2F2F2"/>
  <rect x="30" y="660" width="6" height="40" fill="#C00000"/>
  <text x="50" y="686" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#666666">信息数据战分析报告 · 二、网络阻断已成为开战的"第一枪"</text>
  <rect x="1205" y="665" width="25" height="25" fill="#C00000"/>
  <text x="1217" y="684" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
</svg>