<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#C00000"/>
  <rect x="30" y="20" width="10" height="40" fill="#C00000"/>
  <text x="50" y="52" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="bold" fill="#C00000">没有绝对安全的通信手段</text>
  <rect x="30" y="80" width="1220" height="60" fill="#F2F2F2"/>
  <text x="640" y="116" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#000000" text-anchor="middle">数据内容可以加密，但"正在通信"这一事实无法隐藏</text>
  <rect x="30" y="155" width="1220" height="490" fill="none" stroke="#C00000" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="60" y="180" width="550" height="220" rx="8" fill="#F2F2F2"/>
  <rect x="60" y="180" width="6" height="220" rx="3" fill="#2E75B6"/>
  <rect x="85" y="195" width="50" height="28" rx="4" fill="#2E75B6"/>
  <text x="110" y="215" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">进攻</text>
  <text x="150" y="215" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="bold" fill="#000000">星链渗透行动</text>
  <text x="85" y="248" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">SpaceX向美军出售Starshield军事版</text>
  <text x="85" y="270" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">终端，冲突开始时已部署于无人机系统</text>
  <text x="85" y="295" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">2026年1月，美国国务院利用"互联网</text>
  <text x="85" y="317" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">自由倡议"资金，将约</text>
  <text x="350" y="317" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#C00000">6000</text>
  <text x="385" y="317" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">台终端走私入境</text>
  <text x="85" y="345" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">累计估计有</text>
  <text x="215" y="345" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#C00000">3万~5万</text>
  <text x="305" y="345" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">台自2022年被走私进伊朗</text>
  <rect x="660" y="180" width="550" height="220" rx="8" fill="#F2F2F2"/>
  <rect x="660" y="180" width="6" height="220" rx="3" fill="#C00000"/>
  <rect x="685" y="195" width="50" height="28" rx="4" fill="#C00000"/>
  <text x="710" y="215" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">反制</text>
  <text x="750" y="215" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="bold" fill="#000000">伊朗反制措施</text>
  <text x="685" y="248" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">3月起展开全国性反间谍行动：</text>
  <text x="685" y="273" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">• 锡斯坦-俾路支斯坦省逮捕13人</text>
  <text x="685" y="295" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">  没收5台Starlink终端</text>
  <text x="685" y="320" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">• 德黑兰逮捕39人，没收7台设备</text>
  <text x="685" y="345" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">• 部署射频干扰系统实施军事级干扰</text>
  <text x="685" y="370" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">• 导致部分地区终端完全失效</text>
  <rect x="60" y="420" width="1150" height="60" rx="8" fill="#FDF3EB" stroke="#F8CBAD" stroke-width="2"/>
  <rect x="60" y="420" width="6" height="60" rx="3" fill="#C00000"/>
  <text x="85" y="443" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="bold" fill="#C00000">结论</text>
  <text x="155" y="443" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">在数据对抗时代，进攻方可以利用卫星网络追踪目标，防御方同样可以利用信号特征</text>
  <text x="85" y="466" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#333333">反向定位并没收设备。</text>
  <rect x="60" y="500" width="1150" height="120" rx="8" fill="#F2F2F2"/>
  <rect x="85" y="520" width="30" height="30" fill="#C00000"/>
  <text x="100" y="542" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="135" y="540" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="bold" fill="#000000">核心启示</text>
  <text x="85" y="572" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#333333">• 低轨卫星网络在带来通信优势的同时，也创造了新的攻击面和被追踪风险</text>
  <text x="85" y="594" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#333333">• "互联网自由"工具可能被武器化，技术中立原则在战时受到严峻挑战</text>
  <rect x="30" y="660" width="1220" height="40" fill="#F2F2F2"/>
  <rect x="30" y="660" width="6" height="40" fill="#C00000"/>
  <text x="50" y="686" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#666666">信息数据战分析报告 · 五、没有绝对安全的通信手段</text>
  <rect x="1205" y="665" width="25" height="25" fill="#C00000"/>
  <text x="1217" y="684" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
</svg>