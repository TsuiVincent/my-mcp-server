<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="720" fill="#CC0000"/>
  <text x="50" y="45" fill="#FFFFFF" font-size="20" font-weight="bold" font-family="Microsoft YaHei, sans-serif">五、没有绝对安全的通信手段</text>
  <rect x="6" y="70" width="1274" height="50" fill="#F0F4F8"/>
  <rect x="6" y="70" width="6" height="50" fill="#0066CC"/>
  <text x="30" y="100" fill="#333333" font-size="15" font-family="Microsoft YaHei, sans-serif">核心观点：星链渗透 vs 伊朗反制——一场没有终点的猫鼠游戏</text>
  <!-- Left: Starlink infiltration -->
  <rect x="40" y="145" width="580" height="240" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
  <rect x="40" y="145" width="580" height="32" fill="#003366" rx="8"/>
  <rect x="40" y="169" width="580" height="8" fill="#003366"/>
  <text x="60" y="166" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="Microsoft YaHei, sans-serif">美方：利用星链渗透数据节点</text>
  <text x="60" y="205" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">渗透手段：</text>
  <text x="75" y="228" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">• 2022年以来累计走私3万~5万台Starlink终端</text>
  <text x="75" y="250" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">• 利用低轨卫星网络低延迟、广覆盖特性</text>
  <text x="75" y="272" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">• 向伊朗境内渗透数据节点和通信链路</text>
  <!-- Data highlight -->
  <rect x="70" y="295" width="250" height="60" fill="#E3F2FD" rx="6"/>
  <text x="195" y="322" text-anchor="middle" fill="#1565C0" font-size="26" font-weight="bold" font-family="Arial, sans-serif">3万~5万</text>
  <text x="195" y="343" text-anchor="middle" fill="#666666" font-size="11" font-family="Microsoft YaHei, sans-serif">走私入境的Starlink终端（台）</text>
  <!-- Right: Iran countermeasures -->
  <rect x="660" y="145" width="580" height="240" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
  <rect x="660" y="145" width="580" height="32" fill="#CC0000" rx="8"/>
  <rect x="660" y="169" width="580" height="8" fill="#CC0000"/>
  <text x="680" y="166" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="Microsoft YaHei, sans-serif">伊方：全国反间谍与信号压制</text>
  <text x="680" y="205" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">反制措施：</text>
  <text x="695" y="228" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">• 2026年3月起全国性反间谍行动</text>
  <text x="695" y="250" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">• 宣布没收数百台Starlink终端设备</text>
  <text x="695" y="272" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">• 部署先进射频干扰系统</text>
  <text x="695" y="295" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">• 对星链信号实施军事级干扰压制</text>
  <rect x="690" y="320" width="250" height="40" fill="#FCE4EC" rx="6"/>
  <text x="815" y="346" text-anchor="middle" fill="#C62828" font-size="15" font-weight="bold" font-family="Microsoft YaHei, sans-serif">数百台终端被没收</text>
  <!-- Lower: comparative analysis -->
  <rect x="40" y="420" width="580" height="90" fill="#F0F4F8" rx="8"/>
  <rect x="40" y="420" width="6" height="90" fill="#1565C0" rx="2"/>
  <text x="65" y="448" fill="#1565C0" font-size="15" font-weight="bold" font-family="Microsoft YaHei, sans-serif">攻方优势</text>
  <text x="65" y="475" fill="#333333" font-size="13" font-family="Microsoft YaHei, sans-serif">低轨卫星网络覆盖广、终端便携、难以全面封锁；可快速渗透</text>
  <text x="65" y="496" fill="#333333" font-size="13" font-family="Microsoft YaHei, sans-serif">并建立通信节点，为情报回传和指挥控制提供支撑</text>
  <rect x="660" y="420" width="580" height="90" fill="#F0F4F8" rx="8"/>
  <rect x="660" y="420" width="6" height="90" fill="#C62828" rx="2"/>
  <text x="685" y="448" fill="#C62828" font-size="15" font-weight="bold" font-family="Microsoft YaHei, sans-serif">守方反制</text>
  <text x="685" y="475" fill="#333333" font-size="13" font-family="Microsoft YaHei, sans-serif">通过社会面管控（没收终端）+ 技术手段（射频干扰）相结合，</text>
  <text x="685" y="496" fill="#333333" font-size="13" font-family="Microsoft YaHei, sans-serif">形成多层防御体系，但仍无法实现100%阻断</text>
  <!-- Conclusion -->
  <rect x="40" y="540" width="1200" height="70" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1" rx="8"/>
  <rect x="40" y="540" width="6" height="70" fill="#FF6B35" rx="2"/>
  <text x="65" y="568" fill="#E65100" font-size="15" font-weight="bold" font-family="Microsoft YaHei, sans-serif">⚠ 核心启示</text>
  <text x="65" y="592" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">没有绝对安全的通信手段。<tspan fill="#CC0000" font-weight="bold">攻防双方在通信领域的较量将持续演进，</tspan>单一技术手段无法确保通信安全。</text>
  <!-- Footer -->
  <rect x="0" y="660" width="1280" height="60" fill="#F5F5F5"/>
  <text x="60" y="695" fill="#999999" font-size="12" font-family="Microsoft YaHei, sans-serif">来源：公开报道</text>
  <text x="640" y="695" text-anchor="middle" fill="#999999" font-size="12" font-family="Microsoft YaHei, sans-serif">第五章 · 通信手段</text>
  <text x="1240" y="695" text-anchor="end" fill="#999999" font-size="12" font-family="Microsoft YaHei, sans-serif">12 / 13</text>
</svg>