<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="720" fill="#CC0000"/>
  <text x="50" y="45" fill="#FFFFFF" font-size="20" font-weight="bold" font-family="Microsoft YaHei, sans-serif">三、战争账单本质上就是数据账单</text>
  <rect x="6" y="70" width="1274" height="50" fill="#F0F4F8"/>
  <rect x="6" y="70" width="6" height="50" fill="#0066CC"/>
  <text x="30" y="100" fill="#333333" font-size="15" font-family="Microsoft YaHei, sans-serif">核心观点：导弹昂贵不是因为炸药贵，而是每一枚都是一台会飞的计算机</text>
  <!-- Top row: high-level data cards -->
  <rect x="40" y="145" width="380" height="110" fill="#FCE4EC" rx="8"/>
  <text x="230" y="178" text-anchor="middle" fill="#C62828" font-size="28" font-weight="bold" font-family="Arial, sans-serif">250~290</text>
  <text x="300" y="178" fill="#C62828" font-size="18" font-weight="bold" font-family="Microsoft YaHei, sans-serif">亿美元</text>
  <text x="230" y="208" text-anchor="middle" fill="#666666" font-size="14" font-family="Microsoft YaHei, sans-serif">冲突前两个月美军总花费</text>
  <text x="230" y="235" text-anchor="middle" fill="#666666" font-size="12" font-family="Microsoft YaHei, sans-serif">日均约4~5亿美元</text>
  <rect x="450" y="145" width="380" height="110" fill="#FFF3E0" rx="8"/>
  <text x="640" y="178" text-anchor="middle" fill="#E65100" font-size="28" font-weight="bold" font-family="Arial, sans-serif">113</text>
  <text x="680" y="178" fill="#E65100" font-size="18" font-weight="bold" font-family="Microsoft YaHei, sans-serif">亿美元</text>
  <text x="640" y="208" text-anchor="middle" fill="#666666" font-size="14" font-family="Microsoft YaHei, sans-serif">仅第一周超预算支出</text>
  <text x="640" y="235" text-anchor="middle" fill="#666666" font-size="12" font-family="Microsoft YaHei, sans-serif">前六天消耗尤为剧烈</text>
  <rect x="860" y="145" width="380" height="110" fill="#E3F2FD" rx="8"/>
  <text x="1050" y="178" text-anchor="middle" fill="#1565C0" font-size="24" font-weight="bold" font-family="Arial, sans-serif">~200万</text>
  <text x="1120" y="178" fill="#1565C0" font-size="18" font-weight="bold" font-family="Microsoft YaHei, sans-serif">/枚</text>
  <text x="1050" y="208" text-anchor="middle" fill="#666666" font-size="14" font-family="Microsoft YaHei, sans-serif">战斧巡航导弹单价</text>
  <text x="1050" y="235" text-anchor="middle" fill="#666666" font-size="12" font-family="Microsoft YaHei, sans-serif">JASSM导弹约230万/枚</text>
  <!-- Bottom: Analysis content -->
  <rect x="40" y="280" width="580" height="180" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
  <rect x="40" y="280" width="580" height="32" fill="#003366" rx="8"/>
  <rect x="40" y="304" width="580" height="8" fill="#003366"/>
  <text x="60" y="301" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="Microsoft YaHei, sans-serif">导弹造价：贵在"大脑"而非"身体"</text>
  <text x="60" y="340" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">• 惯性导航系统：不依赖GPS，自主定位</text>
  <text x="60" y="365" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">• 卫星接收机：实时修正飞行轨迹</text>
  <text x="60" y="390" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">• 地形匹配数据库：精确制导核心</text>
  <text x="60" y="415" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">• 末端目标识别模块：AI辅助识别</text>
  <text x="60" y="445" fill="#CC0000" font-size="13" font-weight="bold" font-family="Microsoft YaHei, sans-serif">核心：弹药成本中60%以上是电子/软件成本</text>
  <rect x="660" y="280" width="580" height="180" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
  <rect x="660" y="280" width="580" height="32" fill="#CC0000" rx="8"/>
  <rect x="660" y="304" width="580" height="8" fill="#CC0000"/>
  <text x="680" y="301" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="Microsoft YaHei, sans-serif">战争经济学：数据成本的持续攀升</text>
  <text x="680" y="340" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">• 高精度武器本质是"消耗性数据平台"</text>
  <text x="680" y="365" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">• 导弹单价上升趋势与芯片制程同步</text>
  <text x="680" y="390" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">• 软件升级可提升武器效能，降低弹药消耗</text>
  <text x="680" y="415" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">• 数据链路成本 > 物理杀伤载荷成本</text>
  <text x="680" y="445" fill="#CC0000" font-size="13" font-weight="bold" font-family="Microsoft YaHei, sans-serif">趋势：未来战争将朝着"更贵、更智能"演进</text>
  <!-- Conclusion -->
  <rect x="40" y="490" width="1200" height="80" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1" rx="8"/>
  <rect x="40" y="490" width="6" height="80" fill="#FF6B35" rx="2"/>
  <text x="65" y="518" fill="#E65100" font-size="15" font-weight="bold" font-family="Microsoft YaHei, sans-serif">⚠ 核心启示</text>
  <text x="65" y="545" fill="#333333" font-size="15" font-family="Microsoft YaHei, sans-serif">高精度武器昂贵不是因为炸药贵，而是因为<tspan fill="#CC0000" font-weight="bold">每一枚导弹都是一台会飞的计算机。</tspan>战争账单的实质是数据账单。</text>
  <!-- Footer -->
  <rect x="0" y="660" width="1280" height="60" fill="#F5F5F5"/>
  <text x="60" y="695" fill="#999999" font-size="12" font-family="Microsoft YaHei, sans-serif">来源：公开报道数据</text>
  <text x="640" y="695" text-anchor="middle" fill="#999999" font-size="12" font-family="Microsoft YaHei, sans-serif">第三章 · 战争账单</text>
  <text x="1240" y="695" text-anchor="end" fill="#999999" font-size="12" font-family="Microsoft YaHei, sans-serif">08 / 13</text>
</svg>