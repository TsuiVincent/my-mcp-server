<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <rect x="0" y="0" width="1280" height="70" fill="#003366" />
  <rect x="0" y="0" width="6" height="720" fill="#CC0000" />
  <text x="50" y="45" fill="#FFFFFF" font-size="20" font-weight="bold" font-family="Microsoft YaHei, sans-serif">二、网络阻断已成为开战的"第一枪"</text>
  <rect x="6" y="70" width="1274" height="50" fill="#F0F4F8" />
  <rect x="6" y="70" width="6" height="50" fill="#0066CC" />
  <text x="30" y="100" fill="#333333" font-size="15" font-family="Microsoft YaHei, sans-serif">核心观点：战争在数字空间与物理空间几乎同步打响</text>
  
  <path fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" d="M48,145 H612 A8,8 0 0 1 620,153 V377 A8,8 0 0 1 612,385 H48 A8,8 0 0 1 40,377 V153 A8,8 0 0 1 48,145 Z" />
  <path fill="#003366" d="M48,145 H612 A8,8 0 0 1 620,153 V169 A8,8 0 0 1 612,177 H48 A8,8 0 0 1 40,169 V153 A8,8 0 0 1 48,145 Z" />
  <rect x="40" y="169" width="580" height="8" fill="#003366" />
  <text x="60" y="166" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="Microsoft YaHei, sans-serif">关键数据：伊朗互联网流量断崖式下跌</text>
  
  <path fill="#FCE4EC" d="M76,200 H234 A6,6 0 0 1 240,206 V274 A6,6 0 0 1 234,280 H76 A6,6 0 0 1 70,274 V206 A6,6 0 0 1 76,200 Z" />
  <text x="155" y="235" text-anchor="middle" fill="#C62828" font-size="32" font-weight="bold" font-family="Arial, sans-serif">4%</text>
  <text x="155" y="265" text-anchor="middle" fill="#666666" font-size="12" font-family="Microsoft YaHei, sans-serif">最低流量/正常水平</text>
  <path fill="#E3F2FD" d="M266,200 H424 A6,6 0 0 1 430,206 V274 A6,6 0 0 1 424,280 H266 A6,6 0 0 1 260,274 V206 A6,6 0 0 1 266,200 Z" />
  <text x="345" y="235" text-anchor="middle" fill="#1565C0" font-size="32" font-weight="bold" font-family="Arial, sans-serif">98%</text>
  <text x="345" y="265" text-anchor="middle" fill="#666666" font-size="12" font-family="Microsoft YaHei, sans-serif">流量较前一周下降</text>
  <path fill="#FFF3E0" d="M456,200 H594 A6,6 0 0 1 600,206 V274 A6,6 0 0 1 594,280 H456 A6,6 0 0 1 450,274 V206 A6,6 0 0 1 456,200 Z" />
  <text x="525" y="235" text-anchor="middle" fill="#E65100" font-size="28" font-weight="bold" font-family="Arial, sans-serif">7:00</text>
  <text x="525" y="265" text-anchor="middle" fill="#666666" font-size="12" font-family="Microsoft YaHei, sans-serif">UTC 开战时间</text>
  
  <text x="70" y="315" fill="#333333" font-size="13" font-family="Microsoft YaHei, sans-serif">数据来源：</text>
  <text x="70" y="338" fill="#666666" font-size="12" font-family="Microsoft YaHei, sans-serif">• 国际互联网监测组织 NetBlocks</text>
  <text x="70" y="358" fill="#666666" font-size="12" font-family="Microsoft YaHei, sans-serif">• Cloudflare Radar 同步确认</text>
  
  <path fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" d="M668,145 H1232 A8,8 0 0 1 1240,153 V377 A8,8 0 0 1 1232,385 H668 A8,8 0 0 1 660,377 V153 A8,8 0 0 1 668,145 Z" />
  <path fill="#CC0000" d="M668,145 H1232 A8,8 0 0 1 1240,153 V169 A8,8 0 0 1 1232,177 H668 A8,8 0 0 1 660,169 V153 A8,8 0 0 1 668,145 Z" />
  <rect x="660" y="169" width="580" height="8" fill="#CC0000" />
  <text x="680" y="166" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="Microsoft YaHei, sans-serif">战术意义分析</text>
  <text x="680" y="205" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">① 网络阻断作为"战争起手式"</text>
  <text x="690" y="230" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">切断对手的指挥通信和数据链路，使敌方</text>
  <text x="690" y="250" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">防空系统和情报网络陷入瘫痪</text>
  <text x="680" y="280" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">② 数字与物理空间的协同</text>
  <text x="690" y="305" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">网络攻击与导弹打击几乎同时进行，形成</text>
  <text x="690" y="325" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">"致盲+摧毁"的复合打击链</text>
  <text x="680" y="355" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">③ 新型战争范式</text>
  <text x="690" y="380" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">数据神经被切断后，物理打击的效能倍增</text>
  
  <path fill="#FFF3E0" stroke="#FFB74D" stroke-width="1" d="M48,420 H1232 A8,8 0 0 1 1240,428 V492 A8,8 0 0 1 1232,500 H48 A8,8 0 0 1 40,492 V428 A8,8 0 0 1 48,420 Z" />
  <path fill="#FF6B35" d="M42,420 H44 A2,2 0 0 1 46,422 V498 A2,2 0 0 1 44,500 H42 A2,2 0 0 1 40,498 V422 A2,2 0 0 1 42,420 Z" />
  <text x="65" y="448" fill="#E65100" font-size="15" font-weight="bold" font-family="Microsoft YaHei, sans-serif">⚠ 核心启示</text>
  <text x="65" y="475" fill="#333333" font-size="15" font-family="Microsoft YaHei, sans-serif">网络阻断已成为现代战争的标准起手式。<tspan fill="#CC0000" font-weight="bold">先拔掉数据神经，再实施物理打击，</tspan>已经成为不可逆转的作战范式。</text>
  
  <rect x="0" y="660" width="1280" height="60" fill="#F5F5F5" />
  <text x="60" y="695" fill="#999999" font-size="12" font-family="Microsoft YaHei, sans-serif">来源：NetBlocks, Cloudflare Radar</text>
  <text x="640" y="695" text-anchor="middle" fill="#999999" font-size="12" font-family="Microsoft YaHei, sans-serif">第二章 · 网络阻断</text>
  <text x="1240" y="695" text-anchor="end" fill="#999999" font-size="12" font-family="Microsoft YaHei, sans-serif">06 / 13</text>
</svg>