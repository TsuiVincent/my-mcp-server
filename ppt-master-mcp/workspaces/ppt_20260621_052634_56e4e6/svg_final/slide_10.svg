  <text x="60" y="448" fill="#1565C0" font-size="14" font-family="Microsoft YaHei, sans-serif">攻击策略</text>
  <text x="60" y="478" fill="#333333" font-size="15" font-weight="bold" font-family="Microsoft YaHei, sans-serif">非对称：打击云计算中枢</text>
  <path fill="#FCE4EC" d="M348,420 H612 A8,8 0 0 1 620,428 V492 A8,8 0 0 1 612,500 H348 A8,8 0 0 1 340,492 V428 A8,8 0 0 1 348,420 Z" />
  <rect x="340" y="420" width="6" height="80" fill="#C62828" />
