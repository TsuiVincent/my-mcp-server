  <text x="360" y="478" fill="#333333" font-size="15" font-weight="bold" font-family="Microsoft YaHei, sans-serif">无人机 vs 云设施成本比</text>
  <path fill="#FFF3E0" d="M648,420 H912 A8,8 0 0 1 920,428 V492 A8,8 0 0 1 912,500 H648 A8,8 0 0 1 640,492 V428 A8,8 0 0 1 648,420 Z" />
  <rect x="640" y="420" width="6" height="80" fill="#E65100" />
  <text x="660" y="448" fill="#E65100" font-size="14" font-family="Microsoft YaHei, sans-serif">战场效应</text>
  <text x="660" y="478" fill="#333333" font-size="15" font-weight="bold" font-family="Microsoft YaHei, sans-serif">瘫痪指挥通信链路</text>
  <path fill="#E8F5E9" d="M948,420 H1232 A8,8 0 0 1 1240,428 V492 A8,8 0 0 1 1232,500 H948 A8,8 0 0 1 940,492 V428 A8,8 0 0 1 948,420 Z" />
  <rect x="940" y="420" width="6" height="80" fill="#2E7D32" />
  <text x="960" y="448" fill="#2E7D32" font-size="14" font-family="Microsoft YaHei, sans-serif">未来启示</text>
  <text x="960" y="478" fill="#333333" font-size="15" font-weight="bold" font-family="Microsoft YaHei, sans-serif">算力即战力须重点防护</text>
  
  <path fill="#FFF3E0" stroke="#FFB74D" stroke-width="1" d="M48,530 H1232 A8,8 0 0 1 1240,538 V592 A8,8 0 0 1 1232,600 H48 A8,8 0 0 1 40,592 V538 A8,8 0 0 1 48,530 Z" />
  <path fill="#FF6B35" d="M42,530 H44 A2,2 0 0 1 46,532 V598 A2,2 0 0 1 44,600 H42 A2,2 0 0 1 40,598 V532 A2,2 0 0 1 42,530 Z" />
  <text x="65" y="558" fill="#E65100" font-size="15" font-weight="bold" font-family="Microsoft YaHei, sans-serif">⚠ 核心启示</text>
  <text x="65" y="580" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif"><tspan fill="#CC0000" font-weight="bold">算力节点已成为高价值战略目标。</tspan>未来的冲突中，数据中心与云计算基础设施将面临直接的物理威胁。</text>
  
