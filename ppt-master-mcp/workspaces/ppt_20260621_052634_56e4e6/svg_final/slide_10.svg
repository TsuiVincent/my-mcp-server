  <text x="50" y="45" fill="#FFFFFF" font-size="20" font-weight="bold" font-family="Microsoft YaHei, sans-serif">四、算力节点已成为高价值战略目标</text>
  <rect x="6" y="70" width="1274" height="50" fill="#F0F4F8" />
  <rect x="6" y="70" width="6" height="50" fill="#0066CC" />
  <text x="30" y="100" fill="#333333" font-size="15" font-family="Microsoft YaHei, sans-serif">核心观点：伊朗的非对称反击 — 不打航母，专打数据中心</text>
  
  <path fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" d="M48,145 H612 A8,8 0 0 1 620,153 V377 A8,8 0 0 1 612,385 H48 A8,8 0 0 1 40,377 V153 A8,8 0 0 1 48,145 Z" />
  <path fill="#003366" d="M48,145 H612 A8,8 0 0 1 620,153 V169 A8,8 0 0 1 612,177 H48 A8,8 0 0 1 40,169 V153 A8,8 0 0 1 48,145 Z" />
  <rect x="40" y="169" width="580" height="8" fill="#003366" />
  <text x="60" y="166" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="Microsoft YaHei, sans-serif">伊朗无人机袭击云基础设施</text>
  <text x="60" y="208" fill="#333333" font-size="14" font-weight="bold" font-family="Microsoft YaHei, sans-serif">攻击时间：2026年3月1日—2日</text>
  <text x="60" y="233" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">目标一：AWS 阿联酋 ME-CENTRAL-1 可用区</text>
  <text x="60" y="258" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">目标二：AWS 巴林 ME-SOUTH-1 可用区</text>
  <text x="60" y="283" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">受损服务：EC2、S3、DynamoDB 等核心服务</text>
  <text x="60" y="308" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">影响范围：海湾地区云服务严重降级</text>
  <text x="60" y="338" fill="#CC0000" font-size="13" font-weight="bold" font-family="Microsoft YaHei, sans-serif">关键判断：云计算节点已成为高价值军事目标</text>
  
  <path fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" d="M668,145 H1232 A8,8 0 0 1 1240,153 V377 A8,8 0 0 1 1232,385 H668 A8,8 0 0 1 660,377 V153 A8,8 0 0 1 668,145 Z" />
  <path fill="#CC0000" d="M668,145 H1232 A8,8 0 0 1 1240,153 V169 A8,8 0 0 1 1232,177 H668 A8,8 0 0 1 660,169 V153 A8,8 0 0 1 668,145 Z" />
  <rect x="660" y="169" width="580" height="8" fill="#CC0000" />
  <text x="680" y="166" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="Microsoft YaHei, sans-serif">MQ-9"死神"无人机战损分析</text>
  <text x="680" y="208" fill="#333333" font-size="14" font-weight="bold" font-family="Microsoft YaHei, sans-serif">累计击落数量：≥ 11架</text>
  <text x="680" y="233" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">单机成本：约 3000万~3500万美元</text>
  <text x="680" y="258" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">总损失估算：约 3.3亿~3.85亿美元</text>
  <text x="680" y="283" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">战损原因：综合运用防空系统与电子战手段</text>
  <text x="680" y="313" fill="#CC0000" font-size="13" font-weight="bold" font-family="Microsoft YaHei, sans-serif">趋势：无人机的大规模运用使得成本不对称加剧</text>
  
  <path fill="#E3F2FD" d="M48,420 H312 A8,8 0 0 1 320,428 V492 A8,8 0 0 1 312,500 H48 A8,8 0 0 1 40,492 V428 A8,8 0 0 1 48,420 Z" />
