  <text x="90" y="150" fill="#003366" font-size="18" font-weight="bold" font-family="Microsoft YaHei, sans-serif">一、民用监控系统已成为战略情报源</text>
  <text x="90" y="175" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">交通摄像头 → 全天候瞄准镜，AI行为分析</text>
  
  <path fill="#F0F4F8" d="M668,120 H1192 A8,8 0 0 1 1200,128 V192 A8,8 0 0 1 1192,200 H668 A8,8 0 0 1 660,192 V128 A8,8 0 0 1 668,120 Z" />
  <path fill="#0066CC" d="M662,120 H666 A2,2 0 0 1 668,122 V198 A2,2 0 0 1 666,200 H662 A2,2 0 0 1 660,198 V122 A2,2 0 0 1 662,120 Z" />
  <text x="690" y="150" fill="#003366" font-size="18" font-weight="bold" font-family="Microsoft YaHei, sans-serif">二、网络阻断已成为开战的"第一枪"</text>
  <text x="690" y="175" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">伊朗全国流量断崖下跌至正常水平4%</text>
  
  <path fill="#F0F4F8" d="M68,230 H592 A8,8 0 0 1 600,238 V302 A8,8 0 0 1 592,310 H68 A8,8 0 0 1 60,302 V238 A8,8 0 0 1 68,230 Z" />
  <path fill="#0066CC" d="M62,230 H66 A2,2 0 0 1 68,232 V308 A2,2 0 0 1 66,310 H62 A2,2 0 0 1 60,308 V232 A2,2 0 0 1 62,230 Z" />
  <text x="90" y="260" fill="#003366" font-size="18" font-weight="bold" font-family="Microsoft YaHei, sans-serif">三、战争账单本质上就是数据账单</text>
  <text x="90" y="285" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">前两月美军花费约250~290亿美元</text>
  
  <path fill="#F0F4F8" d="M668,230 H1192 A8,8 0 0 1 1200,238 V302 A8,8 0 0 1 1192,310 H668 A8,8 0 0 1 660,302 V238 A8,8 0 0 1 668,230 Z" />
  <path fill="#0066CC" d="M662,230 H666 A2,2 0 0 1 668,232 V308 A2,2 0 0 1 666,310 H662 A2,2 0 0 1 660,308 V232 A2,2 0 0 1 662,230 Z" />
  <text x="690" y="260" fill="#003366" font-size="18" font-weight="bold" font-family="Microsoft YaHei, sans-serif">四、算力节点已成为高价值战略目标</text>
  <text x="690" y="285" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">伊朗非对称反击：不打航母，专打数据中心</text>
  
  <path fill="#F0F4F8" d="M68,340 H1192 A8,8 0 0 1 1200,348 V412 A8,8 0 0 1 1192,420 H68 A8,8 0 0 1 60,412 V348 A8,8 0 0 1 68,340 Z" />
  <path fill="#CC0000" d="M62,340 H66 A2,2 0 0 1 68,342 V418 A2,2 0 0 1 66,420 H62 A2,2 0 0 1 60,418 V342 A2,2 0 0 1 62,340 Z" />
  <text x="90" y="370" fill="#003366" font-size="18" font-weight="bold" font-family="Microsoft YaHei, sans-serif">五、没有绝对安全的通信手段</text>
  <text x="90" y="395" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">星链渗透、伊朗反间谍行动与射频干扰</text>
  
  <path fill="#E8F0FE" d="M68,460 H1192 A8,8 0 0 1 1200,468 V572 A8,8 0 0 1 1192,580 H68 A8,8 0 0 1 60,572 V468 A8,8 0 0 1 68,460 Z" />
  <path fill="#003366" d="M62,460 H66 A2,2 0 0 1 68,462 V578 A2,2 0 0 1 66,580 H62 A2,2 0 0 1 60,578 V462 A2,2 0 0 1 62,460 Z" />
  <text x="90" y="490" fill="#003366" font-size="16" font-weight="bold" font-family="Microsoft YaHei, sans-serif">核心结论</text>
  <text x="90" y="520" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">现代战争的核心已从火力密度转向数据定力。民用基础设施即战场延伸，数据战没有单方面的绝对优势。</text>
  <text x="90" y="550" fill="#666666" font-size="13" font-family="Microsoft YaHei, sans-serif">下一次战争的第一声警报，可能不是防空雷达的蜂鸣，而是数据中心的断电报警。</text>
  
