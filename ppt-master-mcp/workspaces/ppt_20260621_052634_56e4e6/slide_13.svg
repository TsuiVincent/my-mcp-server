<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- White background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Dark blue top bar -->
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <!-- Red left vertical bar -->
  <rect x="0" y="0" width="6" height="720" fill="#CC0000"/>
  <!-- Logo placeholder -->
  <rect x="1080" y="15" width="160" height="40" fill="#003366" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" rx="4"/>
  <text x="1160" y="40" text-anchor="middle" fill="#FFFFFF" font-size="13" font-family="Microsoft YaHei, sans-serif">结 束</text>
  <!-- Thank you message -->
  <text x="640" y="250" text-anchor="middle" fill="#003366" font-size="36" font-weight="bold" font-family="Microsoft YaHei, sans-serif">总结与启示</text>
  <!-- Tagline -->
  <text x="640" y="290" text-anchor="middle" fill="#666666" font-size="16" font-family="Microsoft YaHei, sans-serif">关于2026年美以对伊军事冲突中信息数据战的分析</text>
  <!-- Decorative divider -->
  <line x1="540" y1="315" x2="740" y2="315" stroke="#0066CC" stroke-width="2"/>
  <circle cx="545" cy="315" r="3" fill="#0066CC"/>
  <circle cx="640" cy="315" r="3" fill="#0066CC"/>
  <circle cx="735" cy="315" r="3" fill="#0066CC"/>
  <!-- Three key conclusion cards -->
  <rect x="40" y="345" width="380" height="120" fill="#F0F4F8" rx="10"/>
  <rect x="40" y="345" width="8" height="120" fill="#CC0000" rx="2"/>
  <text x="230" y="380" text-anchor="middle" fill="#003366" font-size="15" font-weight="bold" font-family="Microsoft YaHei, sans-serif">核心结论一</text>
  <text x="230" y="405" text-anchor="middle" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">现代战争的核心已从火力密度</text>
  <text x="230" y="428" text-anchor="middle" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">转向<tspan fill="#CC0000" font-weight="bold">数据定力</tspan></text>
  <text x="230" y="452" text-anchor="middle" fill="#666666" font-size="12" font-family="Microsoft YaHei, sans-serif">数据链的韧性与抗毁性决定胜负</text>
  <rect x="450" y="345" width="380" height="120" fill="#F0F4F8" rx="10"/>
  <rect x="450" y="345" width="8" height="120" fill="#0066CC" rx="2"/>
  <text x="640" y="380" text-anchor="middle" fill="#003366" font-size="15" font-weight="bold" font-family="Microsoft YaHei, sans-serif">核心结论二</text>
  <text x="640" y="405" text-anchor="middle" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif"><tspan fill="#CC0000" font-weight="bold">民用基础设施即战场延伸</tspan></text>
  <text x="640" y="428" text-anchor="middle" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">交通监控、数据中心等民用设施</text>
  <text x="640" y="452" text-anchor="middle" fill="#666666" font-size="12" font-family="Microsoft YaHei, sans-serif">在战时均可能成为军事目标或情报源</text>
  <rect x="860" y="345" width="380" height="120" fill="#F0F4F8" rx="10"/>
  <rect x="860" y="345" width="8" height="120" fill="#003366" rx="2"/>
  <text x="1050" y="380" text-anchor="middle" fill="#003366" font-size="15" font-weight="bold" font-family="Microsoft YaHei, sans-serif">核心结论三</text>
  <text x="1050" y="405" text-anchor="middle" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif">数据战没有</text>
  <text x="1050" y="428" text-anchor="middle" fill="#333333" font-size="14" font-family="Microsoft YaHei, sans-serif"><tspan fill="#CC0000" font-weight="bold">单方面的绝对优势</tspan></text>
  <text x="1050" y="452" text-anchor="middle" fill="#666666" font-size="12" font-family="Microsoft YaHei, sans-serif">攻防较量将持续演进</text>
  <!-- Quote -->
  <rect x="200" y="495" width="880" height="70" fill="#E8F0FE" rx="8"/>
  <rect x="200" y="495" width="6" height="70" fill="#003366" rx="2"/>
  <text x="640" y="525" text-anchor="middle" fill="#333333" font-size="15" font-style="italic" font-family="Microsoft YaHei, sans-serif">"下一次战争的第一声警报，可能不是防空雷达的蜂鸣，</text>
  <text x="640" y="548" text-anchor="middle" fill="#333333" font-size="15" font-style="italic" font-family="Microsoft YaHei, sans-serif">而是数据中心的断电报警。"</text>
  <!-- Contact info -->
  <rect x="0" y="660" width="1280" height="60" fill="#F5F5F5"/>
  <text x="640" y="695" text-anchor="middle" fill="#999999" font-size="13" font-family="Microsoft YaHei, sans-serif">内部参阅 · 2026年6月</text>
</svg>