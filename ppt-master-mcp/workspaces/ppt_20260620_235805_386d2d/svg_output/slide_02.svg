<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="80" fill="#0a1628"/>
  <text x="80" y="52" fill="#ffffff" font-size="28" font-family="Microsoft YaHei,sans-serif" font-weight="bold">目  录</text>
  <text x="80" y="160" fill="#1565c0" font-size="22" font-family="Microsoft YaHei,sans-serif" font-weight="bold">一、民用监控系统已成为战略情报源</text>
  <text x="80" y="240" fill="#1565c0" font-size="22" font-family="Microsoft YaHei,sans-serif" font-weight="bold">二、网络阻断已成为开战的"第一枪"</text>
  <text x="80" y="320" fill="#1565c0" font-size="22" font-family="Microsoft YaHei,sans-serif" font-weight="bold">三、战争账单本质上就是数据账单</text>
  <text x="80" y="400" fill="#1565c0" font-size="22" font-family="Microsoft YaHei,sans-serif" font-weight="bold">四、算力节点已成为高价值战略目标</text>
  <text x="80" y="480" fill="#1565c0" font-size="22" font-family="Microsoft YaHei,sans-serif" font-weight="bold">五、没有绝对安全的通信手段</text>
</svg>