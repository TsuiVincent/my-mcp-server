<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B5C"/>
      <stop offset="50%" stop-color="#004080"/>
      <stop offset="100%" stop-color="#001F4D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Tech grid texture -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="720" fill="url(#accentGrad)"/>

  <!-- Top decoration line -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#lineGrad)"/>

  <!-- Geometric decorative circles -->
  <circle cx="1100" cy="150" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
  <circle cx="1150" cy="200" r="80" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
  <circle cx="200" cy="600" r="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
  <circle cx="250" cy="620" r="60" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Decorative bright blue accent block -->
  <rect x="80" y="180" width="4" height="120" fill="#00B4D8" fill-opacity="0.6"/>

  <!-- Main title -->
  <text x="100" y="220" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF">2026年美以对伊军事冲突中</text>
  <text x="100" y="280" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF">信息数据战的分析报告</text>

  <!-- Decorative divider line -->
  <rect x="100" y="310" width="80" height="3" fill="#00B4D8"/>
  <circle cx="190" cy="311" r="3" fill="#00B4D8"/>
  <circle cx="200" cy="311" r="2" fill="#00B4D8" fill-opacity="0.6"/>

  <!-- Subtitle -->
  <text x="100" y="360" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#B0D4F1">"史诗狂怒"行动 · 供内部参阅</text>

  <!-- Bottom info area -->
  <rect x="0" y="650" width="1280" height="70" fill="#001F4D" fill-opacity="0.6"/>
  <text x="100" y="690" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#8CB8DF">2026年6月</text>
  <text x="1180" y="690" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6B9FCA" text-anchor="end">内部参阅</text>

  <!-- Bottom decoration -->
  <rect x="0" y="716" width="1280" height="4" fill="#0050B3"/>
</svg>