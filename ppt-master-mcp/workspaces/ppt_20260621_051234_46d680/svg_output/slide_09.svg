<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B5C"/>
      <stop offset="50%" stop-color="#004080"/>
      <stop offset="100%" stop-color="#001F4D"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Tech grid -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="213" y1="0" x2="213" y2="720"/>
    <line x1="426" y1="0" x2="426" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="853" y1="0" x2="853" y2="720"/>
    <line x1="1066" y1="0" x2="1066" y2="720"/>
  </g>

  <!-- Top decoration -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#lineGrad)"/>
  <rect x="0" y="0" width="6" height="720" fill="url(#lineGrad)"/>

  <!-- Wave curve decoration -->
  <path d="M0,650 Q160,620 320,640 T640,630 T960,645 T1280,635 L1280,720 L0,720 Z" fill="#00B4D8" fill-opacity="0.06"/>
  <path d="M0,670 Q320,640 640,660 T1280,650 L1280,720 L0,720 Z" fill="#0050B3" fill-opacity="0.08"/>

  <!-- Decorative circles -->
  <circle cx="1060" cy="200" r="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
  <circle cx="1120" cy="260" r="90" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <circle cx="200" cy="550" r="80" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Thank you message -->
  <text x="640" y="280" font-family="Microsoft YaHei, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle">谢谢</text>
  <text x="640" y="340" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#B0D4F1" text-anchor="middle">Thank You</text>

  <!-- Divider -->
  <rect x="540" y="370" width="100" height="3" fill="#00B4D8"/>
  <circle cx="650" cy="371" r="3" fill="#00B4D8"/>
  <circle cx="660" cy="371" r="2" fill="#00B4D8" fill-opacity="0.6"/>
  <rect x="670" y="370" width="100" height="3" fill="#00B4D8"/>

  <!-- Contact card -->
  <rect x="440" y="410" width="400" height="120" fill="#FFFFFF" fill-opacity="0.08" rx="10" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
  <text x="640" y="448" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">关于2026年美以对伊军事冲突中</text>
  <text x="640" y="478" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">信息数据战的分析报告</text>
  <text x="640" y="512" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#8CB8DF" text-anchor="middle">供内部参阅 · 2026年6月</text>

  <!-- Bottom -->
  <rect x="0" y="660" width="1280" height="60" fill="#001F4D" fill-opacity="0.6"/>
  <text x="640" y="696" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#6B9FCA" text-anchor="middle">以上分析供领导参考</text>

  <rect x="0" y="716" width="1280" height="4" fill="#0050B3"/>
</svg>