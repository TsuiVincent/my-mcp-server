  <path fill="url(#numGrad)" d="M64,30 H106 A4,4 0 0 1 110,34 V76 A4,4 0 0 1 106,80 H64 A4,4 0 0 1 60,76 V34 A4,4 0 0 1 64,30 Z" />
  <text x="85" y="62" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="130" y="62" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#1A1A1A">算力节点已成为高价值战略目标</text>
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#D0E4F7" stroke-width="1" stroke-dasharray="6 4" />

  <path fill="#F0F6FF" d="M64,120 H1216 A4,4 0 0 1 1220,124 V164 A4,4 0 0 1 1216,168 H64 A4,4 0 0 1 60,164 V124 A4,4 0 0 1 64,120 Z" />
  <path fill="#00B4D8" d="M62,120 H62 A2,2 0 0 1 64,122 V166 A2,2 0 0 1 62,168 H62 A2,2 0 0 1 60,166 V122 A2,2 0 0 1 62,120 Z" />
  <text x="80" y="150" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#004080">面对全世界最强大的军队，伊朗选择了一条非对称反击路线：不打航母，专打数据中心。</text>

  
  <path fill="#F8FBFF" stroke="#D0E4F7" stroke-width="1" d="M68,188 H622 A8,8 0 0 1 630,196 V460 A8,8 0 0 1 622,468 H68 A8,8 0 0 1 60,460 V196 A8,8 0 0 1 68,188 Z" />
  <path fill="#C41E3A" d="M62,188 H62 A2,2 0 0 1 64,190 V466 A2,2 0 0 1 62,468 H62 A2,2 0 0 1 60,466 V190 A2,2 0 0 1 62,188 Z" />
  <text x="80" y="218" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#C41E3A">伊朗无人机袭击AWS数据中心</text>
  <text x="80" y="248" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 2026年3月1-2日，伊朗无人机对海湾基础设施发动袭击</text>
  <text x="80" y="274" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• AWS阿联酋ME-CENTRAL-1、巴林ME-SOUTH-1被命中</text>
  <text x="80" y="300" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 建筑结构损坏、电力中断、消防系统误启动损毁服务器</text>
  <text x="80" y="326" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• EC2、S3、DynamoDB核心服务严重降级</text>
  <text x="80" y="352" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• AWS敦促客户启动灾难恢复，迁移至欧洲/亚太</text>
  <path fill="#FFF0F0" d="M84,370 H606 A4,4 0 0 1 610,374 V402 A4,4 0 0 1 606,406 H84 A4,4 0 0 1 80,402 V374 A4,4 0 0 1 84,370 Z" />
  <text x="90" y="394" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#C41E3A">学术界将此事件直接引用为"云主权"危机案例</text>
  <text x="80" y="448" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA">来源：AWS官方确认 · arXiv.org</text>

  
  <path fill="#F8FBFF" stroke="#D0E4F7" stroke-width="1" d="M658,188 H1212 A8,8 0 0 1 1220,196 V460 A8,8 0 0 1 1212,468 H658 A8,8 0 0 1 650,460 V196 A8,8 0 0 1 658,188 Z" />
  <path fill="#0050B3" d="M652,188 H652 A2,2 0 0 1 654,190 V466 A2,2 0 0 1 652,468 H652 A2,2 0 0 1 650,466 V190 A2,2 0 0 1 652,188 Z" />
  <text x="670" y="218" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#0050B3">美军MQ-9"死神"无人机被击落</text>
  <path fill="#FFFFFF" stroke="#C41E3A" stroke-width="1.5" d="M676,238 H1194 A6,6 0 0 1 1200,244 V302 A6,6 0 0 1 1194,308 H676 A6,6 0 0 1 670,302 V244 A6,6 0 0 1 676,238 Z" />
  <text x="935" y="266" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#C41E3A" text-anchor="middle">≥11</text>
  <text x="935" y="296" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333" text-anchor="middle">累计击落MQ-9数量（架）</text>
  <text x="670" y="330" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 使用AD-08 Majid等防空系统</text>
  <text x="670" y="356" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 每架成本约3000万-3500万美元</text>
  <text x="670" y="382" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 打击日期：3月2、3、6、7、13、31日、5月6日</text>
  <path fill="#F0F6FF" d="M674,400 H1196 A4,4 0 0 1 1200,404 V432 A4,4 0 0 1 1196,436 H674 A4,4 0 0 1 670,432 V404 A4,4 0 0 1 674,400 Z" />
  <text x="680" y="424" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#004080">损失不仅是硬件，更是侦察-打击链条的断裂</text>
  <text x="670" y="448" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA">来源：Aviation Safety Network</text>

  
  <path fill="#FFF8F0" stroke="#F0C48A" stroke-width="1" d="M66,488 H1214 A6,6 0 0 1 1220,494 V538 A6,6 0 0 1 1214,544 H66 A6,6 0 0 1 60,538 V494 A6,6 0 0 1 66,488 Z" />
  <path fill="#C41E3A" d="M62,488 H62 A2,2 0 0 1 64,490 V542 A2,2 0 0 1 62,544 H62 A2,2 0 0 1 60,542 V490 A2,2 0 0 1 62,488 Z" />
  <text x="80" y="510" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#C41E3A">结论：</text>
  <text x="145" y="510" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#333333">摧毁一个算力节点，可能比摧毁十个军事基地更具战略效果。保护数据中心已不再是商业问题，而是国防问题。</text>
  <text x="145" y="532" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6B9FCA">云不是无形的——它是一栋栋可以被导弹命中的混凝土建筑</text>

  <rect x="0" y="680" width="1280" height="40" fill="#F8FBFF" />
  <text x="60" y="705" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA">四、算力节点</text>
  <text x="640" y="705" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA" text-anchor="middle">AWS官方 · arXiv.org · Aviation Safety Network</text>
  <text x="1220" y="705" font-family="Arial, sans-serif" font-size="13" fill="#6B9FCA" text-anchor="end">06</text>
