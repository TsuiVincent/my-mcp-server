  <text x="80" y="150" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#004080">先切断对手的数据神经，再实施物理打击——现代战争的标准起手式。</text>

  
  <path fill="#FFFFFF" stroke="#C41E3A" stroke-width="2" d="M68,188 H412 A8,8 0 0 1 420,196 V300 A8,8 0 0 1 412,308 H68 A8,8 0 0 1 60,300 V196 A8,8 0 0 1 68,188 Z" />
