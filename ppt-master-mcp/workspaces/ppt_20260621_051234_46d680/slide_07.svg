<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0050B3"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#barGrad)"/>
  <rect x="0" y="0" width="6" height="720" fill="url(#barGrad)"/>
  <rect x="60" y="30" width="50" height="50" fill="url(#numGrad)" rx="4"/>
  <text x="85" y="62" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="130" y="62" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#1A1A1A">没有绝对安全的通信手段</text>
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#D0E4F7" stroke-width="1" stroke-dasharray="6 4"/>

  <rect x="60" y="120" width="1160" height="48" fill="#F0F6FF" rx="4"/>
  <rect x="60" y="120" width="4" height="48" fill="#00B4D8" rx="2"/>
  <text x="80" y="150" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#004080">如果你用星链这样的先进卫星网络去渗透一个国家，你以为自己是猎人，但你也可能变成猎物。</text>

  <!-- Left: Starlink offensive -->
  <rect x="60" y="188" width="570" height="240" fill="#F8FBFF" rx="8" stroke="#D0E4F7" stroke-width="1"/>
  <rect x="60" y="188" width="4" height="240" fill="#0050B3" rx="2"/>
  <text x="80" y="218" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#0050B3">美方攻势：星链渗透</text>
  <text x="80" y="248" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• SpaceX向美军出售Starshield军事版终端</text>
  <text x="80" y="274" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 冲突开始时已部署于十多个无人机系统</text>
  <text x="80" y="300" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 美国务院利用"互联网自由倡议"资金</text>
  <text x="80" y="326" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 约6000台Starlink终端走私入境伊朗</text>
  <text x="80" y="352" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 累计估计3万-5万台自2022年起流入</text>
  <text x="80" y="400" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA">来源：路透社调查（基于五角大楼文件）· PressTV</text>

  <!-- Right: Iranian counter -->
  <rect x="650" y="188" width="570" height="240" fill="#FFF8F0" rx="8" stroke="#F0C48A" stroke-width="1"/>
  <rect x="650" y="188" width="4" height="240" fill="#C41E3A" rx="2"/>
  <text x="670" y="218" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#C41E3A">伊朗反制：反间谍与射频干扰</text>
  <text x="670" y="248" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 情报部全国反间谍行动，没收数百台终端</text>
  <text x="670" y="274" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 3月19日：锡斯坦省逮捕13人，没收5台终端</text>
  <text x="670" y="300" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 3月25日：德黑兰逮捕39人，没收7台设备</text>
  <text x="670" y="326" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 部署射频干扰系统，军事级干扰信号</text>
  <text x="670" y="352" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 非法使用Starlink定为刑事犯罪</text>
  <text x="670" y="400" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA">来源：伊朗情报部 · ایران اینترنشنال · Military.com</text>

  <!-- Key insight -->
  <rect x="60" y="448" width="1160" height="56" fill="#F0F6FF" rx="6" stroke="#D0E4F7" stroke-width="1"/>
  <rect x="60" y="448" width="4" height="56" fill="#00B4D8" rx="2"/>
  <text x="80" y="470" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#0050B3">核心矛盾：</text>
  <text x="175" y="470" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#333333">数据内容可以加密，但"正在通信"这一事实无法隐藏。</text>
  <text x="175" y="492" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6B9FCA">进攻方可以利用卫星网络追踪目标，防御方同样可以利用信号特征反向定位并没收设备。</text>

  <rect x="0" y="680" width="1280" height="40" fill="#F8FBFF"/>
  <text x="60" y="705" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA">五、通信安全</text>
  <text x="640" y="705" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA" text-anchor="middle">路透社 · 伊朗情报部 · Military.com</text>
  <text x="1220" y="705" font-family="Arial, sans-serif" font-size="13" fill="#6B9FCA" text-anchor="end">07</text>
  <rect x="0" y="716" width="1280" height="4" fill="#0050B3"/>
</svg>