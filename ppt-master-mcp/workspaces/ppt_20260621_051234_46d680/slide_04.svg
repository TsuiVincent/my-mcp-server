<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0050B3"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#barGrad)"/>
  <rect x="0" y="0" width="6" height="720" fill="url(#barGrad)"/>
  <rect x="60" y="30" width="50" height="50" fill="url(#numGrad)" rx="4"/>
  <text x="85" y="62" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="130" y="62" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#1A1A1A">网络阻断已成为开战的"第一枪"</text>
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#D0E4F7" stroke-width="1" stroke-dasharray="6 4"/>

  <rect x="60" y="120" width="1160" height="48" fill="#F0F6FF" rx="4"/>
  <rect x="60" y="120" width="4" height="48" fill="#00B4D8" rx="2"/>
  <text x="80" y="150" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#004080">先切断对手的数据神经，再实施物理打击——现代战争的标准起手式。</text>

  <!-- Key data highlight box -->
  <rect x="60" y="188" width="360" height="120" fill="#FFFFFF" rx="8" stroke="#C41E3A" stroke-width="2"/>
  <text x="240" y="228" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#C41E3A" text-anchor="middle">~4%</text>
  <text x="240" y="258" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333" text-anchor="middle">伊朗全国互联网流量降至正常水平</text>
  <text x="240" y="282" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA" text-anchor="middle">数据来源：NetBlocks · 2026.2.28 7:00 UTC</text>

  <rect x="440" y="188" width="380" height="120" fill="#FFFFFF" rx="8" stroke="#C41E3A" stroke-width="2"/>
  <text x="630" y="228" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#C41E3A" text-anchor="middle">-98%</text>
  <text x="630" y="258" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333" text-anchor="middle">较前一周下降幅度（Cloudflare Radar）</text>
  <text x="630" y="282" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA" text-anchor="middle">德黑兰/法尔斯/伊斯法罕主要省份接近归零</text>

  <rect x="840" y="188" width="380" height="120" fill="#FFFFFF" rx="8" stroke="#00B4D8" stroke-width="2"/>
  <text x="1030" y="228" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#0050B3" text-anchor="middle">多重</text>
  <text x="1030" y="258" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333" text-anchor="middle">因素叠加：外部攻击+主动切网</text>
  <text x="1030" y="282" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA" text-anchor="middle">IODA（乔治亚理工学院）独立数据确认</text>

  <!-- Detailed info card -->
  <rect x="60" y="328" width="570" height="200" fill="#F8FBFF" rx="8" stroke="#D0E4F7" stroke-width="1"/>
  <rect x="60" y="328" width="4" height="200" fill="#0050B3" rx="2"/>
  <text x="80" y="358" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#0050B3">数字空间的同步攻击</text>
  <text x="80" y="388" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 伊朗通讯社IRNA、塔斯尼姆通讯社被入侵下线</text>
  <text x="80" y="414" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• BadeSaba祈祷应用被劫持，推送心理战信息</text>
  <text x="80" y="440" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 公共遥测数据无法区分外部攻击与内部断网</text>
  <text x="80" y="466" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 可确认结果：丧失对外信息输出和应急指挥带宽</text>
  <text x="80" y="500" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA">来源：lukaszolejnik.com · NetBlocks · Cloudflare Radar · IODA</text>

  <!-- Conclusion -->
  <rect x="650" y="328" width="570" height="200" fill="#FFF8F0" rx="8" stroke="#F0C48A" stroke-width="1"/>
  <rect x="650" y="328" width="4" height="200" fill="#C41E3A" rx="2"/>
  <text x="670" y="358" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#C41E3A">战略启示</text>
  <rect x="670" y="378" width="530" height="80" fill="#FFFFFF" rx="6" stroke="#E0E0E0" stroke-width="1"/>
  <text x="935" y="405" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle">网络战的窗口可能只有数小时</text>
  <text x="935" y="432" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6B9FCA" text-anchor="middle">但这数小时足以决定整场战局的走向</text>
  <text x="670" y="478" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">关键信息基础设施的供应链安全和主动防御能力，</text>
  <text x="670" y="502" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">已与航母、战斗机同等重要。</text>

  <rect x="0" y="680" width="1280" height="40" fill="#F8FBFF"/>
  <text x="60" y="705" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA">二、网络阻断</text>
  <text x="640" y="705" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA" text-anchor="middle">NetBlocks · Cloudflare Radar · IODA</text>
  <text x="1220" y="705" font-family="Arial, sans-serif" font-size="13" fill="#6B9FCA" text-anchor="end">04</text>
  <rect x="0" y="716" width="1280" height="4" fill="#0050B3"/>
</svg>