<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0050B3"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#barGrad)"/>
  <rect x="0" y="0" width="6" height="720" fill="url(#barGrad)"/>
  <rect x="60" y="30" width="50" height="50" fill="url(#numGrad)" rx="4"/>
  <text x="85" y="62" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="130" y="62" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#1A1A1A">战争账单本质上就是数据账单</text>
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#D0E4F7" stroke-width="1" stroke-dasharray="6 4"/>

  <rect x="60" y="120" width="1160" height="48" fill="#F0F6FF" rx="4"/>
  <rect x="60" y="120" width="4" height="48" fill="#00B4D8" rx="2"/>
  <text x="80" y="150" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#004080">高精度武器之所以昂贵，不是因为炸药贵，而是因为每一枚导弹都是一台会飞的计算机。</text>

  <!-- Top row: cost data -->
  <rect x="60" y="188" width="270" height="90" fill="#FFFFFF" rx="6" stroke="#C41E3A" stroke-width="1.5"/>
  <text x="195" y="222" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#C41E3A" text-anchor="middle">250-290亿</text>
  <text x="195" y="260" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#333333" text-anchor="middle">前两月花费（美元）</text>

  <rect x="350" y="188" width="270" height="90" fill="#FFFFFF" rx="6" stroke="#C41E3A" stroke-width="1.5"/>
  <text x="485" y="222" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#C41E3A" text-anchor="middle">~21亿</text>
  <text x="485" y="260" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#333333" text-anchor="middle">前六天日均消耗（美元）</text>

  <rect x="640" y="188" width="270" height="90" fill="#FFFFFF" rx="6" stroke="#0050B3" stroke-width="1.5"/>
  <text x="775" y="222" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0050B3" text-anchor="middle">230万</text>
  <text x="775" y="260" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#333333" text-anchor="middle">JASSM导弹单价（美元）</text>

  <rect x="930" y="188" width="270" height="90" fill="#FFFFFF" rx="6" stroke="#0050B3" stroke-width="1.5"/>
  <text x="1065" y="222" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0050B3" text-anchor="middle">200万</text>
  <text x="1065" y="260" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#333333" text-anchor="middle">战斧巡航导弹单价（美元）</text>

  <!-- Core insight area -->
  <rect x="60" y="298" width="570" height="220" fill="#F8FBFF" rx="8" stroke="#D0E4F7" stroke-width="1"/>
  <rect x="60" y="298" width="4" height="220" fill="#0050B3" rx="2"/>
  <text x="80" y="328" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#0050B3">导弹是一台会飞的计算机</text>
  <text x="80" y="358" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 惯性导航系统 + 卫星接收机 + 地形匹配数据库</text>
  <text x="80" y="384" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 末端目标识别模块（算法自主区分真伪目标）</text>
  <text x="80" y="410" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 卫星数据链实时更新目标坐标</text>
  <text x="80" y="444" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA">来源：FlightGlobal · 2026财年预算文件</text>

  <!-- Cost comparison -->
  <rect x="650" y="298" width="570" height="220" fill="#FFF8F0" rx="8" stroke="#F0C48A" stroke-width="1"/>
  <rect x="650" y="298" width="4" height="220" fill="#C41E3A" rx="2"/>
  <text x="670" y="328" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#C41E3A">后期成本骤降——数据链需求降低</text>
  <text x="670" y="358" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 2000磅 GBU-31 JDAM：约10.7万美元</text>
  <text x="670" y="384" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 1000磅 GBU-32 JDAM：约7.9万美元</text>
  <text x="670" y="410" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333333">• 500磅 GBU-38 JDAM：约7.5万美元</text>
  <text x="670" y="444" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#C41E3A" font-weight="bold">原因：防空削弱后目标固定，数据链需求大降</text>
  <text x="670" y="490" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA">来源：Stephen Semler等独立分析师 · CSIS 2026年4月报告</text>

  <!-- Conclusion -->
  <rect x="60" y="538" width="1160" height="50" fill="#F0F6FF" rx="6" stroke="#D0E4F7" stroke-width="1"/>
  <text x="640" y="570" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#C41E3A" text-anchor="middle">所谓战争烧钱，本质上是烧数据。若对手具备干扰数据链路的能力，则昂贵弹药将迅速贬值。</text>

  <rect x="0" y="680" width="1280" height="40" fill="#F8FBFF"/>
  <text x="60" y="705" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA">三、战争账单</text>
  <text x="640" y="705" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#6B9FCA" text-anchor="middle">五角大楼 · 沃顿商学院 · CSIS</text>
  <text x="1220" y="705" font-family="Arial, sans-serif" font-size="13" fill="#6B9FCA" text-anchor="end">05</text>
  <rect x="0" y="716" width="1280" height="4" fill="#0050B3"/>
</svg>