<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="contentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#contentBg)"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#numGrad)"/>
  <!-- Title Bar with number block -->
  <rect x="60" y="30" width="50" height="50" fill="#0050B3"/>
  <text x="85" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="130" y="62" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1A1A1A">民用监控系统已成为战略情报源</text>
  <!-- Dashed divider -->
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#A0C4E8" stroke-width="1" stroke-dasharray="6 4"/>
  <!-- Content cards -->
  <!-- Card 1 -->
  <rect x="60" y="130" width="1160" height="100" rx="8" fill="#FFFFFF" stroke="#D0E4F5" stroke-width="1"/>
  <rect x="60" y="130" width="6" height="100" fill="#00B4D8" rx="3"/>
  <text x="86" y="162" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#003580">情报来源：民用监控系统的战略化利用</text>
  <text x="86" y="190" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">
    <tspan x="86" dy="0">• 以色列8200部队与摩萨德多年渗透伊朗民用交通摄像头、市政传感器</tspan>
    <tspan x="86" dy="24">• 接管设备控制权，将实时视频流加密回传至以色列服务器</tspan>
  </text>
  <!-- Card 2 -->
  <rect x="60" y="250" width="1160" height="100" rx="8" fill="#FFFFFF" stroke="#D0E4F5" stroke-width="1"/>
  <rect x="60" y="250" width="6" height="100" fill="#00B4D8" rx="3"/>
  <text x="86" y="282" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#003580">AI行为模式分析</text>
  <text x="86" y="310" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">
    <tspan x="86" dy="0">• AI算法对海量视频数据进行行为模式分析</tspan>
    <tspan x="86" dy="24">• 识别护卫车队路线、统计人员车辆出入频率、推断车辆隶属关系</tspan>
  </text>
  <!-- Card 3 -->
  <rect x="60" y="370" width="1160" height="100" rx="8" fill="#FFFFFF" stroke="#D0E4F5" stroke-width="1"/>
  <rect x="60" y="370" width="6" height="100" fill="#00B4D8" rx="3"/>
  <text x="86" y="402" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#003580">开战首日精确打击</text>
  <text x="86" y="430" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">
    <tspan x="86" dy="0">• 开战当天AI系统直接输出高精度目标坐标</tspan>
    <tspan x="86" dy="24">• 以军F-15战机7:30起飞，9:40"蓝麻雀"导弹命中目标</tspan>
  </text>
  <!-- Conclusion box -->
  <rect x="60" y="500" width="1160" height="80" rx="8" fill="#E8F4FD" stroke="#00B4D8" stroke-width="1"/>
  <text x="640" y="535" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#C41E3A">结论</text>
  <text x="640" y="562" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#003580">城市智慧化程度越高，战场透明化程度也越高。民用监控设施的战时军事价值急剧上升。</text>
  <!-- Footer -->
  <line x1="60" y1="660" x2="1220" y2="660" stroke="#D0E4F5" stroke-width="1"/>
  <text x="60" y="695" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#999999">来源：路透社、金融时报、多名前情报官员</text>
  <text x="1220" y="695" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#999999">03</text>
</svg>