<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="endBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F4D" />
      <stop offset="50%" stop-color="#003580" />
      <stop offset="100%" stop-color="#0050B3" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#endBg)" />
  
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" /><line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" /><line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" /><line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" /><line x1="0" y1="640" x2="1280" y2="640" />
    <line x1="160" y1="0" x2="160" y2="720" /><line x1="320" y1="0" x2="320" y2="720" />
    <line x1="480" y1="0" x2="480" y2="720" /><line x1="640" y1="0" x2="640" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" /><line x1="960" y1="0" x2="960" y2="720" />
    <line x1="1120" y1="0" x2="1120" y2="720" />
  </g>
  
  <path d="M0,600 Q160,560 320,590 T640,570 T960,590 T1280,570 L1280,720 L0,720 Z" fill="#00B4D8" fill-opacity="0.06" />
  <rect x="0" y="0" width="1280" height="6" fill="#00B4D8" />
  <rect x="0" y="714" width="1280" height="6" fill="#0050B3" />
  
  <text x="640" y="100" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">三条总体判断</text>
  <rect x="540" y="115" width="200" height="3" fill="#00B4D8" />
  
  
  <path fill="#FFFFFF" fill-opacity="0.08" stroke="#00B4D8" stroke-width="1" d="M90,150 H1190 A10,10 0 0 1 1200,160 V270 A10,10 0 0 1 1190,280 H90 A10,10 0 0 1 80,270 V160 A10,10 0 0 1 90,150 Z" />
  <path fill="#00B4D8" d="M84,150 H84 A4,4 0 0 1 88,154 V276 A4,4 0 0 1 84,280 H84 A4,4 0 0 1 80,276 V154 A4,4 0 0 1 84,150 Z" />
  <text x="116" y="200" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#00B4D8">判断一 · 从火力密度转向数据定力</text>
  <text font-size="15" fill="#C8DFF0" font-family="Microsoft YaHei, sans-serif" x="116" y="235">谁掌握数据采集、传输、算力和算法，谁就掌握主动权。</text><text font-size="15" fill="#C8DFF0" font-family="Microsoft YaHei, sans-serif" x="116" y="259">从德黑兰的摄像头到星链终端，从网络骨干网到数据中心，数据流贯穿战争全周期。</text><path fill="#FFFFFF" fill-opacity="0.08" stroke="#00B4D8" stroke-width="1" d="M90,300 H1190 A10,10 0 0 1 1200,310 V420 A10,10 0 0 1 1190,430 H90 A10,10 0 0 1 80,420 V310 A10,10 0 0 1 90,300 Z" />
  <path fill="#00B4D8" d="M84,300 H84 A4,4 0 0 1 88,304 V426 A4,4 0 0 1 84,430 H84 A4,4 0 0 1 80,426 V304 A4,4 0 0 1 84,300 Z" />
  <text x="116" y="350" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#00B4D8">判断二 · 民用基础设施即战场延伸</text>
  <text font-size="15" fill="#C8DFF0" font-family="Microsoft YaHei, sans-serif" x="116" y="385">交通摄像头、云数据中心、低轨卫星互联网、手机应用程序——这些日常数字服务，</text><text font-size="15" fill="#C8DFF0" font-family="Microsoft YaHei, sans-serif" x="116" y="409">在战时瞬间转化为情报来源、打击目标和攻防工具。民用与军用之间的界限已经消失。</text><path fill="#FFFFFF" fill-opacity="0.08" stroke="#00B4D8" stroke-width="1" d="M90,450 H1190 A10,10 0 0 1 1200,460 V570 A10,10 0 0 1 1190,580 H90 A10,10 0 0 1 80,570 V460 A10,10 0 0 1 90,450 Z" />
  <path fill="#00B4D8" d="M84,450 H84 A4,4 0 0 1 88,454 V576 A4,4 0 0 1 84,580 H84 A4,4 0 0 1 80,576 V454 A4,4 0 0 1 84,450 Z" />
  <text x="116" y="500" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#00B4D8">判断三 · 数据战没有单方面的绝对优势</text>
  <text font-size="15" fill="#C8DFF0" font-family="Microsoft YaHei, sans-serif" x="116" y="535">伊朗以非对称手段打击数据中心、击落无人机、没收星链终端，</text><text font-size="15" fill="#C8DFF0" font-family="Microsoft YaHei, sans-serif" x="116" y="559">说明即使是技术弱势一方，也能找到强者的数据节点实施致命打击。</text><text x="640" y="640" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#8AB4E8">下一次战争的第一声警报，可能不是防空雷达的蜂鸣，而是数据中心的断电报警</text>
  
  <text x="1220" y="695" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#6B8DB5">08</text>
</svg>