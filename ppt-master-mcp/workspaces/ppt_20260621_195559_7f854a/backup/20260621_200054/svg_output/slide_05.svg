<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg3)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#grad3)"/>
  <rect x="60" y="30" width="50" height="50" fill="#0050B3"/>
  <text x="85" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="130" y="62" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1A1A1A">战争账单本质上就是数据账单</text>
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#A0C4E8" stroke-width="1" stroke-dasharray="6 4"/>
  <!-- Top highlight -->
  <rect x="60" y="120" width="1160" height="60" rx="8" fill="#001F4D"/>
  <text x="640" y="146" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">冲突前两个月美军花费约 <tspan fill="#00B4D8">250亿至290亿美元</tspan>，日均约 <tspan fill="#00B4D8">4至5亿美元</tspan></text>
  <text x="640" y="168" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#8AB4E8">第一周未预算支出超113亿美元（CSIS修正为约127亿美元），日均约21亿美元</text>
  <!-- Three data cards -->
  <rect x="60" y="200" width="370" height="150" rx="8" fill="#FFFFFF" stroke="#D0E4F5" stroke-width="1"/>
  <rect x="60" y="200" width="370" height="5" fill="#C41E3A" rx="3"/>
  <text x="640" y="348" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#C41E3A">---</text>
  <text x="245" y="248" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#C41E3A">战斧巡航导弹</text>
  <text x="245" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#003580">约200万$</text>
  <text x="245" y="310" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#666666">每枚=惯性导航+卫星+地形匹配+目标识别</text>

  <rect x="455" y="200" width="370" height="150" rx="8" fill="#FFFFFF" stroke="#D0E4F5" stroke-width="1"/>
  <rect x="455" y="200" width="370" height="5" fill="#C41E3A" rx="3"/>
  <text x="640" y="248" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#C41E3A">JASSM防区外导弹</text>
  <text x="640" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#003580">约230万$</text>
  <text x="640" y="310" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#666666">需卫星数据链实时更新目标坐标</text>

  <rect x="850" y="200" width="370" height="150" rx="8" fill="#FFFFFF" stroke="#D0E4F5" stroke-width="1"/>
  <rect x="850" y="200" width="370" height="5" fill="#00B4D8" rx="3"/>
  <text x="1035" y="248" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#00B4D8">JDAM制导炸弹</text>
  <text x="1035" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#003580">7.5-10.7万$</text>
  <text x="1035" y="310" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#666666">后期使用，数据链需求大幅降低</text>

  <!-- Insight bar -->
  <rect x="60" y="380" width="560" height="90" rx="8" fill="#E8F4FD" stroke="#00B4D8" stroke-width="1"/>
  <text x="340" y="410" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#003580">弹药成本 = 数据链成本</text>
  <text x="340" y="440" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">采购的不是普通弹药，而是数据终端</text>
  <text x="340" y="460" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">若对手干扰数据链路，昂贵弹药迅速贬值</text>

  <!-- THAAD losses -->
  <rect x="640" y="380" width="580" height="90" rx="8" fill="#FFF5F5" stroke="#C41E3A" stroke-width="1"/>
  <text x="930" y="410" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#C41E3A">防空拦截弹消耗（CSIS数据）</text>
  <text x="930" y="440" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">THAAD消耗至少50%（约190-290枚）</text>
  <text x="930" y="460" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">补充周期：SM-3需64个月，THAAD需53个月</text>

  <!-- Footer -->
  <line x1="60" y1="660" x2="1220" y2="660" stroke="#D0E4F5" stroke-width="1"/>
  <text x="60" y="695" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#999999">来源：五角大楼、宾夕法尼亚大学沃顿商学院、CSIS、FlightGlobal</text>
  <text x="1220" y="695" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#999999">05</text>
</svg>