<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg4)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#grad4)"/>
  <rect x="60" y="30" width="50" height="50" fill="#0050B3"/>
  <text x="85" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="130" y="62" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1A1A1A">算力节点已成为高价值战略目标</text>
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#A0C4E8" stroke-width="1" stroke-dasharray="6 4"/>
  <!-- Key statement -->
  <rect x="60" y="120" width="1160" height="55" rx="8" fill="#001F4D"/>
  <text x="640" y="153" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">伊朗非对称反击路线：<tspan fill="#00B4D8">不打航母，专打数据中心</tspan></text>
  <!-- Two column layout -->
  <rect x="60" y="195" width="760" height="200" rx="8" fill="#FFFFFF" stroke="#D0E4F5" stroke-width="1"/>
  <rect x="60" y="195" width="6" height="200" fill="#C41E3A" rx="3"/>
  <text x="86" y="227" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#C41E3A">AWS数据中心遭袭（2026.3.1-3.2）</text>
  <text x="86" y="255" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">
    <tspan x="86" dy="0">• 伊朗无人机袭击阿联酋ME-CENTRAL-1和巴林ME-SOUTH-1可用区</tspan>
    <tspan x="86" dy="22">• AWS官方确认：建筑结构损坏、电力中断、消防系统误启损毁服务器</tspan>
    <tspan x="86" dy="22">• EC2、S3、DynamoDB等核心服务严重降级</tspan>
    <tspan x="86" dy="22">• 学术界直接引用为"云主权"危机案例</tspan>
  </text>
  <!-- Right info box -->
  <rect x="840" y="195" width="380" height="200" rx="8" fill="#FFF5F5" stroke="#C41E3A" stroke-width="1"/>
  <text x="1030" y="227" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#C41E3A">MQ-9"死神"无人机损失</text>
  <line x1="860" y1="240" x2="1200" y2="240" stroke="#C41E3A" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1030" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#003580">≥11架</text>
  <text x="1030" y="305" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">3月多日被AD-08 Majid击落</text>
  <text x="1030" y="335" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">每架成本约3000-3500万美元</text>
  <text x="1030" y="365" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#C41E3A">侦察-打击链条断裂</text>

  <!-- Analysis box -->
  <rect x="60" y="420" width="1160" height="100" rx="8" fill="#E8F4FD" stroke="#00B4D8" stroke-width="1"/>
  <text x="640" y="455" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#003580">战略启示</text>
  <text x="640" y="485" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">云不是无形的，它是一栋栋可以被导弹命中的混凝土建筑。摧毁一个算力节点，可能比摧毁十个军事基地更具战略效果。</text>
  <text x="640" y="510" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">保护数据中心已不是商业问题，而是国防问题。</text>

  <!-- Footer -->
  <line x1="60" y1="660" x2="1220" y2="660" stroke="#D0E4F5" stroke-width="1"/>
  <text x="60" y="695" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#999999">来源：AWS官方确认、arXiv.org、Aviation Safety Network</text>
  <text x="1220" y="695" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#999999">06</text>
</svg>