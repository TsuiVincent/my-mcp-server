<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5FAFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0050B3"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg5)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#grad5)"/>
  <rect x="60" y="30" width="50" height="50" fill="#0050B3"/>
  <text x="85" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="130" y="62" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1A1A1A">没有绝对安全的通信手段</text>
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#A0C4E8" stroke-width="1" stroke-dasharray="6 4"/>
  <!-- Highlight -->
  <rect x="60" y="120" width="1160" height="55" rx="8" fill="#001F4D"/>
  <text x="640" y="153" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">你以为自己是猎人，但你也可能变成猎物</text>
  <!-- Card 1 -->
  <rect x="60" y="195" width="760" height="180" rx="8" fill="#FFFFFF" stroke="#D0E4F5" stroke-width="1"/>
  <rect x="60" y="195" width="6" height="180" fill="#00B4D8" rx="3"/>
  <text x="86" y="227" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#003580">星链终端渗透与反渗透</text>
  <text x="86" y="255" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">
    <tspan x="86" dy="0">• Starshield军事版终端部署于十多个无人机系统</tspan>
    <tspan x="86" dy="22">• 美国利用"互联网自由倡议"将约6000台Starlink终端走私入境伊朗</tspan>
    <tspan x="86" dy="22">• 累计估计有3万至5万台Starlink终端自2022年以来被走私进伊朗</tspan>
    <tspan x="86" dy="22">• 伊朗情报部全国性反间谍行动，没收数百台终端</tspan>
  </text>
  <!-- Side stats -->
  <rect x="840" y="195" width="380" height="180" rx="8" fill="#FFF5F5" stroke="#C41E3A" stroke-width="1"/>
  <text x="1030" y="227" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#C41E3A">伊朗反制行动</text>
  <line x1="860" y1="240" x2="1200" y2="240" stroke="#C41E3A" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1030" y="275" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">3月19日：锡斯坦被捕13人</text>
  <text x="1030" y="300" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">没收5台Starlink+枪支监视设备</text>
  <text x="1030" y="330" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">3月25日：德黑兰被捕39人</text>
  <text x="1030" y="355" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">没收7台Starlink+49枚自制炸弹</text>
  <!-- Conclusion card -->
  <rect x="60" y="400" width="1160" height="90" rx="8" fill="#E8F4FD" stroke="#00B4D8" stroke-width="1"/>
  <text x="640" y="435" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#003580">非对称对抗的典型逻辑</text>
  <text x="640" y="462" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">进攻方可以利用卫星网络追踪目标，防御方同样可以利用信号特征反向定位并没收设备</text>
  <text x="640" y="482" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#444444">数据内容可以加密，但"正在通信"这一事实无法隐藏</text>
  <!-- Footer -->
  <line x1="60" y1="660" x2="1220" y2="660" stroke="#D0E4F5" stroke-width="1"/>
  <text x="60" y="695" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#999999">来源：路透社调查、五角大楼文件、Iran International、Military.com</text>
  <text x="1220" y="695" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#999999">07</text>
</svg>