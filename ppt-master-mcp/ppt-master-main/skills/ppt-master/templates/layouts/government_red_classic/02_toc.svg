<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <defs>
        <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#C41E3A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="1280" height="720" fill="#FAFAFA"/>
    <!-- 顶部红色横条 -->
    <rect x="0" y="0" width="1280" height="5" fill="url(#headerGrad)"/>
    <!-- 标题区 -->
    <rect x="0" y="5" width="1280" height="80" fill="#FFFFFF"/>
    <rect x="60" y="35" width="8" height="30" fill="#C41E3A"/>
    <text x="80" y="62" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="32" font-weight="bold" fill="#1A1A1A">目 录</text>
    <text x="200" y="65" font-family="Arial, sans-serif" font-size="13" fill="#999">CONTENTS</text>
    <rect x="0" y="85" width="1280" height="1" fill="#E8E8E8"/>
    <!-- 目录项 -->
    <g>
        <rect x="80" y="120" width="50" height="50" fill="#C41E3A" rx="4"/>
        <text x="105" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">01</text>
        <text x="160" y="145" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_1_TITLE}}</text>
        <text x="160" y="175" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#888">{{TOC_ITEM_1_DESC}}</text>
        <rect x="1080" y="130" width="100" height="30" fill="#FFF3F3" rx="4" stroke="#C41E3A" stroke-width="1"/>
        <text x="1130" y="152" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#C41E3A">第1页</text>
    </g>
    <g>
        <rect x="80" y="220" width="50" height="50" fill="#C41E3A" rx="4"/>
        <text x="105" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">02</text>
        <text x="160" y="245" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_2_TITLE}}</text>
        <text x="160" y="275" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#888">{{TOC_ITEM_2_DESC}}</text>
    </g>
    <g>
        <rect x="80" y="320" width="50" height="50" fill="#C41E3A" rx="4"/>
        <text x="105" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">03</text>
        <text x="160" y="345" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_3_TITLE}}</text>
        <text x="160" y="375" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#888">{{TOC_ITEM_3_DESC}}</text>
    </g>
    <g>
        <rect x="80" y="420" width="50" height="50" fill="#C41E3A" rx="4"/>
        <text x="105" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">04</text>
        <text x="160" y="445" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_4_TITLE}}</text>
        <text x="160" y="475" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#888">{{TOC_ITEM_4_DESC}}</text>
    </g>
    <g>
        <rect x="80" y="520" width="50" height="50" fill="#C41E3A" rx="4"/>
        <text x="105" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">05</text>
        <text x="160" y="545" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_5_TITLE}}</text>
        <text x="160" y="575" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#888">{{TOC_ITEM_5_DESC}}</text>
    </g>
    <!-- 右侧装饰 -->
    <rect x="880" y="110" width="320" height="520" fill="#FAF0F3" rx="8"/>
    <rect x="880" y="110" width="6" height="520" fill="url(#headerGrad)"/>
    <text x="1040" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#C41E3A" fill-opacity="0.08">{{STAT_NUMBER_1}}</text>
    <text x="1040" y="350" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#555">{{STAT_LABEL_1}}</text>
    <rect x="920" y="385" width="240" height="1" fill="#E8D0D0"/>
    <text x="1040" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#8B0000" fill-opacity="0.10">{{STAT_NUMBER_2}}</text>
    <text x="1040" y="490" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#555">{{STAT_LABEL_2}}</text>
    <!-- 底部 -->
    <rect x="0" y="715" width="1280" height="5" fill="url(#headerGrad)"/>
    <text x="640" y="695" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#AAA">{{PAGE_NUM}}</text>
</svg>
