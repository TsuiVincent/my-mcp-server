<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <defs>
        <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#C41E3A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <!-- 顶部装饰条 -->
    <rect x="0" y="0" width="1280" height="5" fill="url(#topGrad)"/>
    <!-- 页眉 -->
    <rect x="60" y="30" width="50" height="50" fill="#C41E3A"/>
    <text x="85" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">{{CHAPTER_NUM}}</text>
    <text x="130" y="65" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#1A1A1A">{{PAGE_TITLE}}</text>
    <text x="1170" y="60" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#999">{{ORG_SHORT}}</text>
    <!-- 内容区 -->
    <rect x="60" y="100" width="1160" height="560" fill="none" stroke="#E8E8E8" stroke-width="2" stroke-dasharray="10,10" rx="6"/>
    <text x="640" y="360" text-anchor="middle" fill="#DDD" font-size="18" font-family="Microsoft YaHei, sans-serif">{{CONTENT_AREA}}</text>
    <text x="640" y="395" text-anchor="middle" fill="#DDD" font-size="14" font-family="Microsoft YaHei, sans-serif">(由 AI 根据实际内容自由布局)</text>
    <!-- 底部 -->
    <rect x="0" y="715" width="1280" height="5" fill="url(#topGrad)"/>
    <text x="640" y="695" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#AAA">{{PAGE_NUM}}</text>
    <text x="1170" y="695" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#BBB">{{ORG_SHORT}}</text>
</svg>
