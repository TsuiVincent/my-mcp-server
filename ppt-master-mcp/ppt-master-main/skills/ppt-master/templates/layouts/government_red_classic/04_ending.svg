<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#C41E3A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4A0000;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#D4A853;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#F5D68A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#D4A853;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
    <!-- 金色边框 -->
    <rect x="30" y="30" width="1220" height="660" fill="none" stroke="url(#goldGrad)" stroke-width="2" rx="4"/>
    <!-- 五星装饰 -->
    <polygon points="640,120 650,150 680,150 655,170 665,200 640,180 615,200 625,170 600,150 630,150" fill="#F5D68A" fill-opacity="0.5"/>
    <!-- 感谢语 -->
    <text x="640" y="300" text-anchor="middle" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="60" font-weight="bold" fill="#FFD700">{{THANK_YOU}}</text>
    <!-- 金色分隔线 -->
    <rect x="450" y="350" width="380" height="2" fill="url(#goldGrad)"/>
    <!-- 英文 -->
    <text x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#FFFFFF" fill-opacity="0.5" letter-spacing="3">{{THANK_YOU_EN}}</text>
    <!-- 单位 -->
    <text x="640" y="500" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#FFFFFF" fill-opacity="0.9">{{AUTHOR}}</text>
    <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.4">{{CONTACT_INFO}}</text>
    <!-- 底部 -->
    <rect x="0" y="680" width="1280" height="40" fill="#000000" fill-opacity="0.3"/>
    <text x="640" y="707" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.7">{{ENDING_SUBTITLE}}</text>
</svg>
