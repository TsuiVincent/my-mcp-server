<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#C41E3A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#6B0000;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#C4A44A;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#F5D68A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#C4A44A;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
    <!-- 金带顶底 -->
    <rect x="0" y="0" width="1280" height="8" fill="url(#goldGrad)"/>
    <rect x="0" y="712" width="1280" height="8" fill="url(#goldGrad)"/>
    <!-- 八一军徽五角星 -->
    <polygon points="640,110 652,145 690,145 660,168 672,205 640,182 608,205 620,168 590,145 628,145" fill="#F5D68A" fill-opacity="0.5"/>
    <text x="640" y="155" text-anchor="middle" font-family="SimHei, sans-serif" font-size="28" font-weight="bold" fill="#C41E3A" fill-opacity="0.9">八 一</text>
    <!-- 标题区 -->
    <rect x="120" y="230" width="1040" height="2" fill="url(#goldGrad)"/>
    <text x="640" y="320" text-anchor="middle" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="54" font-weight="bold" fill="#FFFFFF">{{TITLE}}</text>
    <text x="640" y="390" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#FFFFFF" fill-opacity="0.9">{{SUBTITLE}}</text>
    <rect x="120" y="440" width="1040" height="2" fill="url(#goldGrad)"/>
    <!-- 单位 -->
    <text x="640" y="520" text-anchor="middle" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="26" fill="#F5D68A">{{AUTHOR}}</text>
    <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.4" letter-spacing="3">{{AUTHOR_EN}}</text>
    <text x="640" y="640" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.7">{{DATE}}</text>
    <!-- 底部 -->
    <text x="640" y="702" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#F5D68A" fill-opacity="0.6">{{ORGANIZATION}}</text>
</svg>
