<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#C41E3A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#6B0000;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#C4A44A;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#F5D68A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#C4A44A;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1280" height="6" fill="url(#goldGrad)"/>
    <rect x="0" y="714" width="1280" height="6" fill="url(#goldGrad)"/>
    <!-- 八一军徽 -->
    <polygon points="640,120 652,155 690,155 660,178 672,215 640,192 608,215 620,178 590,155 628,155" fill="#F5D68A" fill-opacity="0.45"/>
    <text x="640" y="162" text-anchor="middle" font-family="SimHei, sans-serif" font-size="24" font-weight="bold" fill="#8B0000" fill-opacity="0.9">八 一</text>
    <!-- 感谢语 -->
    <text x="640" y="340" text-anchor="middle" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="60" font-weight="bold" fill="#FFFFFF">{{THANK_YOU}}</text>
    <rect x="440" y="380" width="400" height="2" fill="url(#goldGrad)"/>
    <text x="640" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" fill-opacity="0.5" letter-spacing="4">{{THANK_YOU_EN}}</text>
    <text x="640" y="510" text-anchor="middle" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="22" fill="#F5D68A">{{AUTHOR}}</text>
    <text x="640" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" fill-opacity="0.3">{{CONTACT_INFO}}</text>
    <text x="640" y="700" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#F5D68A" fill-opacity="0.5">{{ENDING_SUBTITLE}}</text>
</svg>
