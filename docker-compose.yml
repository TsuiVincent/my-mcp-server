services:
  # ============================================================
  # Server 1: Markitdown 格式转换
  # ============================================================
  mcp-markitdown:
    build: ./mcp-markitdown
    container_name: mcp-markitdown
    restart: unless-stopped
    ports:
      - "19101:19101"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - mcp-network

  # ============================================================
  # Server 3: 浏览器自动化 (Playwright)
  # ============================================================
  mcp-browser-playwright:
    build: ./mcp-browser-playwright
    container_name: mcp-browser-playwright
    restart: unless-stopped
    ports:
      - "19102:19102"
    environment:
      - TZ=Asia/Shanghai
    shm_size: "2gb"          # Chromium 需要较大共享内存
    networks:
      - mcp-network

  # ============================================================
  # Server 4: Sequential Thinking 结构化推理
  # ============================================================
  mcp-sequential-thinking:
    build: ./mcp-sequential-thinking
    container_name: mcp-sequential-thinking
    restart: unless-stopped
    ports:
      - "19103:19103"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - mcp-network

  # ============================================================
  # Server 5: 数据查询与分析
  # ============================================================
  mcp-data-platform:
    build: ./mcp-data-platform
    container_name: mcp-data-platform
    restart: unless-stopped
    ports:
      - "19104:19104"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - data_platform_data:/data/mcp-user-data
    networks:
      - mcp-network

  # ============================================================
  # Server 6: 时间日期服务（从 mcp-fetch-intranet 拆分）
  # ============================================================
  mcp-datetime:
    build: ./mcp-datetime
    container_name: mcp-datetime
    restart: unless-stopped
    ports:
      - "19105:19105"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - mcp-network

  # ============================================================
  # Server 7: 运维与监控
  # ============================================================
  mcp-ops-monitor:
    build: ./mcp-ops-monitor
    container_name: mcp-ops-monitor
    restart: unless-stopped
    ports:
      - "19106:19106"
    environment:
      - TZ=Asia/Shanghai
    privileged: true
    pid: "host"
    networks:
      - mcp-network

  # ============================================================
  # Server 8: 内网抓取与API网关
  # ============================================================
  mcp-fetch-intranet:
    build: ./mcp-fetch-intranet
    container_name: mcp-fetch-intranet
    restart: unless-stopped
    ports:
      - "19107:19107"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - fetch_intranet_data:/data/mcp-user-data
    networks:
      - mcp-network

  # ============================================================
  # Server 9: PPT Master - AI PPT 生成与增强 (v2.0.0)
  # ============================================================
  ppt-master-mcp:
    build: ./ppt-master-mcp
    container_name: ppt-master-mcp
    restart: unless-stopped
    ports:
      - "19108:19108"
    env_file:
      - ./ppt-master-mcp/.env
    environment:
      - TZ=Asia/Shanghai
      - PPT_IMAGE_GEN_ENABLED=${PPT_IMAGE_GEN_ENABLED:-false}
      - PPT_AUDIO_ENABLED=${PPT_AUDIO_ENABLED:-false}
    volumes:
      - ppt_master_data:/app/workspaces
    networks:
      - mcp-network

  # ============================================================
  # Server 10a: 智能填表专用（Word + Excel）
  # ============================================================
  mcp-form-fill:
    build: ./mcp-form-fill
    container_name: mcp-form-fill
    restart: unless-stopped
    ports:
      - "19120:19120"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - form_fill_data:/data
      - ${USERPROFILE:-~}/Downloads:/mnt/host/downloads
      - ${USERPROFILE:-~}/Desktop:/mnt/host/desktop
      - ${USERPROFILE:-~}/Documents:/mnt/host/documents
    networks:
      - mcp-network

  # ============================================================
  # Server 11b: Word 通用操作
  # ============================================================
  mcp-office-word:
    build: ./mcp-office-word
    container_name: mcp-office-word
    restart: unless-stopped
    ports:
      - "19121:19121"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - office_word_data:/data
      - ${USERPROFILE:-~}/Downloads:/mnt/host/downloads
      - ${USERPROFILE:-~}/Desktop:/mnt/host/desktop
      - ${USERPROFILE:-~}/Documents:/mnt/host/documents
    networks:
      - mcp-network

  # ============================================================
  # Server 11c: Excel/CSV 通用操作
  # ============================================================
  mcp-office-excel:
    build: ./mcp-office-excel
    container_name: mcp-office-excel
    restart: unless-stopped
    ports:
      - "19122:19122"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - office_excel_data:/data
      - ${USERPROFILE:-~}/Downloads:/mnt/host/downloads
      - ${USERPROFILE:-~}/Desktop:/mnt/host/desktop
      - ${USERPROFILE:-~}/Documents:/mnt/host/documents
    networks:
      - mcp-network

  # ============================================================
  # Server 11d: PDF 操作
  # ============================================================
  mcp-office-pdf:
    build: ./mcp-office-pdf
    container_name: mcp-office-pdf
    restart: unless-stopped
    ports:
      - "19123:19123"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - office_pdf_data:/data
      - ${USERPROFILE:-~}/Downloads:/mnt/host/downloads
      - ${USERPROFILE:-~}/Desktop:/mnt/host/desktop
      - ${USERPROFILE:-~}/Documents:/mnt/host/documents
    networks:
      - mcp-network

  # ============================================================
  # Server 11: Draw.io AI 图表生成与预览
  # ============================================================
  mcp-drawio:
    build: ./mcp-drawio
    container_name: mcp-drawio
    restart: unless-stopped
    ports:
      - "19110:19110"
      - "19111:19111"
    environment:
      - TZ=Asia/Shanghai
      - DRAWIO_PREVIEW_BASE=http://localhost:19111
    volumes:
      - drawio_data:/data
    networks:
      - mcp-network

# ============================================================
# 共享网络
# ============================================================
networks:
  mcp-network:
    driver: bridge

# ============================================================
# 持久化卷
# ============================================================
volumes:
  data_platform_data:    # mcp-data-platform 用户数据
  fetch_intranet_data:   # mcp-fetch-intranet 配置数据
  ppt_master_data:       # ppt-master-mcp PPT 项目工作区
  drawio_data:           # mcp-drawio 图表数据
  form_fill_data:        # mcp-form-fill 填表数据
  office_word_data:      # mcp-office-word 文档数据
  office_excel_data:     # mcp-office-excel 表格数据
  office_pdf_data:       # mcp-office-pdf PDF 数据
